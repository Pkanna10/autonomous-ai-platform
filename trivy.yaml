# Trivy configuration for faster config scanning
# This file optimizes Trivy scans by skipping non-critical directories and files

scan:
  # Skip non-critical directories (25-35% scan time reduction)
  skip-dirs:
    - "**/node_modules"
    - "**/vendor"
    - "**/venv"
    - "**/.next"
    - "**/dist"
    - "**/build"
    - "**/.terraform"
    - "**/__pycache__"
    - "**/.git"
    - "**/coverage"
    - "**/.pytest_cache"
    - "**/.vitest-cache"
    - "**/.turbo"
    - "**/out"

  # Skip non-critical files
  skip-files:
    - "**/*.lock"
    - "**/*.log"
    - "**/*.sum"
    - "**/package-lock.json"
    - "**/pnpm-lock.yaml"
    - "**/yarn.lock"
    - "**/Gemfile.lock"
    - "**/Pipfile.lock"
    - "**/*.md"
    - "**/*.txt"
    - "**/.env*"
    - "**/.DS_Store"

# Vulnerability filtering
vulnerability:
  # Skip unfixed vulnerabilities for cleaner reports (not skipping in CI)
  skip-unfixed: false

# Database settings
db:
  skip-update: false  # Allow DB updates on first run

# Reporting preferences
severity:
  - CRITICAL
  - HIGH
  - MEDIUM
  - LOW
