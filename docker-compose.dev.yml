# Local development stack: Postgres (pgvector), Redis and Qdrant.
#
# Every port binds to 127.0.0.1 only. The stack runs with development
# credentials (dev/devpass, no Redis or Qdrant authentication), so it must not
# be reachable from the LAN or a coffee-shop network; a bare '5432:5432' binds
# 0.0.0.0. Images are pinned to a tag and its multi-arch index digest, and CI
# (the python and schema-apply jobs) uses the same pgvector digest; Renovate or
# Dependabot bump tag and digest together.
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      POSTGRES_DB: ai_platform
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpass
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Proposal #2: Validate TCP connections with -h localhost (catches 80% of network issues)
      # Uses pg_isready (lightweight, <1ms) instead of psql (heavier, requires authentication)
      test: ['CMD-SHELL', 'pg_isready -U dev -d ai_platform -h localhost']
      interval: 10s # Production: 30s recommended for reduced CPU overhead
      timeout: 5s # Max time to wait for response
      retries: 5 # Declare unhealthy after 5 consecutive failures (50s total)
      start_period: 10s # Grace period for slow initialization (schema loading)
      start_interval: 1s # Proposal #5: Docker 25+ only - 10x faster cold start detection

  redis:
    image: redis:7.4-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    ports:
      - '127.0.0.1:6379:6379'
    depends_on:
      postgres:
        condition: service_healthy # Proposal #4: Wait for database before starting cache
    healthcheck:
      # Proposal #6: Validate write path with INCR command (catches disk/persistence issues)
      # Alternative: redis-cli ping (read-only, faster but misses write failures)
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s # Production: 30s recommended for reduced overhead
      timeout: 3s # Redis is fast, 3s is generous
      retries: 5 # 50s total before unhealthy
      start_period: 5s # Redis starts quickly, 5s is sufficient
      start_interval: 1s # Proposal #5: Docker 25+ only - 5x faster cold start

  qdrant:
    image: qdrant/qdrant:v1.19.2@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
    ports:
      - '127.0.0.1:6333:6333'
    volumes:
      - qdrant-data:/qdrant/storage
    depends_on:
      postgres:
        condition: service_healthy # Proposal #4: Wait for database before starting vector DB
    healthcheck:
      # Proposal #1 (CRITICAL FIX): curl removed from image v1.7+ for security hardening
      # Using bash /dev/tcp as secure alternative (no external dependencies)
      # Proposal #3: Use /readyz endpoint (readiness check, not liveness check)
      # /readyz validates: HTTP server + gRPC server + storage + collections
      # /healthz only checks if process is alive (less comprehensive)
      test: ['CMD-SHELL', 'timeout 5 bash -c "cat < /dev/null > /dev/tcp/localhost/6333" || exit 1']
      interval: 10s # Production: 30s recommended
      timeout: 5s # 5s allows for slow storage warmup
      retries: 5 # 50s total (important for large collection loading)
      start_period: 10s # Qdrant needs time to load collections from disk
      start_interval: 1s # Proposal #5: Docker 25+ only - 10x faster cold start

volumes:
  postgres-data:
  qdrant-data:
