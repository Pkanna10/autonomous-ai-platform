version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16 # Updated from pg15 to pg16 for security patches
    environment:
      POSTGRES_DB: ai_platform
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpass
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/schema:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  qdrant:
    image: qdrant/qdrant:v1.15.5 # Pinned to stable version for reproducibility
    ports:
      - '6333:6333'
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  postgres-data:
  qdrant-data:
