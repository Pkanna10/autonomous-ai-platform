packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'

# Supply chain: a package version must be at least this old (minutes; seven
# days) before pnpm resolves it. The compromised npm releases of 2025 (the
# chalk/debug takeover, the self-replicating worm) were pulled within hours to
# days; a cooldown keeps such versions out of new resolutions. Installs from
# the lockfile (--frozen-lockfile) are unaffected. There is no security
# exemption: to take a fix younger than a week, list the package under
# minimumReleaseAgeExclude for that install. Dependabot's version updates use
# the same seven-day cooldown (its security updates open immediately).
minimumReleaseAge: 10080

# Audit exception (Step 3 stage gate, 2026-11-01): GHSA-g3hv-75wg-m249,
# minimatch < 11.0.1, a DoS via crafted glob patterns. Reached only through
# ESLint and typescript-eslint (dev tooling), whose patterns come from our own
# config. The only fix is minimatch 11, a major released 2026-10-27 that no
# version of ESLint or typescript-eslint accepts yet. Remove this entry when
# Dependabot brings in a release of either that depends on minimatch >= 11.0.1.
auditConfig:
  ignoreGhsas:
    - GHSA-g3hv-75wg-m249
