# ============================================
# Build System Configuration (Tier 3: Hatchling Migration)
# ============================================
# Migrated from setuptools to hatchling for 1.5-2x faster builds
# Research: Pure Python project (no C extensions), PEP 621 compliant
# Benefits: Faster builds, simpler config, excellent PEP 621 support
[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

# ============================================
# Project Metadata
# ============================================
[project]
name = "autonomous-ai-agents"
version = "0.1.0"
description = "LangGraph orchestrator and research agents for autonomous AI platform"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Praveen Kanna" }]
maintainers = [{ name = "Praveen Kanna" }]
keywords = [
    "ai",
    "agents",
    "langgraph",
    "langchain",
    "anthropic",
    "research",
    "autonomous",
    "claude",
    "llm",
    "multi-agent",
    "orchestration",
    "arxiv",
    "pdf-parsing",
    "code-generation",
    "self-improving",
]
classifiers = [
    # Development Status
    "Development Status :: 3 - Alpha",
    # Intended Audience
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    # License
    "License :: OSI Approved :: MIT License",
    # Natural Language
    "Natural Language :: English",
    # Operating System
    "Operating System :: OS Independent",
    # Programming Language
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    # Topics
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Text Processing :: Markup :: Markdown",
    # Typing
    "Typing :: Typed",
]

# ============================================
# Dependencies Organized by Phase (Tier 3: Proposal #12)
# ============================================
# Phase 1, Week 3-4: LangGraph Orchestrator & Intent Parsing
dependencies = [
    # Core AI/ML (constrained for fast resolution)
    "anthropic>=0.68.0,<0.69.0",      # Claude Sonnet 4.5 API client
    "langgraph>=0.2.0,<0.3.0",        # State machine orchestration
    "langchain>=0.3.0,<0.4.0",        # LLM framework base

    # Data validation & settings
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",

    # Utilities
    "python-dotenv>=1.0.0",           # .env file loading
    "structlog>=23.0.0",              # Structured logging
]

[project.optional-dependencies]
# ============================================
# Phase 1, Week 5-6: Package Manager (NPM/PyPI search)
# ============================================
package-manager = [
    "requests>=2.31.0,<3.0.0",          # HTTP client for registry APIs
    "httpx>=0.25.0,<1.0.0",             # Async HTTP client
]

# ============================================
# Phase 1, Week 7-8: Research Engine (arXiv monitoring)
# ============================================
research = [
    "pymupdf>=1.25.0,<2.0.0",           # PDF parsing for research papers
    "arxiv>=2.1.0",                     # arXiv API client
    "sentence-transformers>=2.2.0",     # Embeddings for semantic search
]

# ============================================
# Phase 2, Week 10-14: Code Generation (ts-morph integration)
# ============================================
codegen = [
    "black>=24.0.0",                    # Python code formatter
    "isort>=5.13.0",                    # Import sorting
]

# ============================================
# Phase 3: Database & Caching (PostgreSQL, Redis, Qdrant)
# ============================================
database = [
    "psycopg[binary]>=3.1.0,<4.0.0",    # PostgreSQL driver
    "asyncpg>=0.29.0,<1.0.0",           # Async PostgreSQL
    "redis>=5.0.0,<6.0.0",              # Redis client
]

# ============================================
# Development dependencies (all phases)
# ============================================
dev = [
    # Testing
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.5.0",              # Parallel test execution
    "pytest-timeout>=2.2.0",            # Test timeout enforcement
    "pytest-benchmark>=4.0.0",          # Performance benchmarking

    # Type checking
    "mypy>=1.13.0",
    "types-requests",

    # Linting & formatting
    "ruff>=0.8.0",                      # 10-100x faster than pylint

    # Security scanning
    "pip-audit>=2.7.0",                 # PyPA official vulnerability scanner
    "bandit[toml]>=1.7.0",              # SAST security linter
    "safety>=3.0.0",                    # Dependency security checker

    # Profiling (Tier 4: Import optimization)
    "pyinstrument>=4.6.0",              # Statistical profiler
    "py-spy>=0.3.0",                    # Sampling profiler
    "memory-profiler>=0.61.0",          # Memory profiling
]

# All dependencies (orchestrator + all phases + dev)
# Install with: uv pip install -e ".[all]"
all = [
    "autonomous-ai-agents[package-manager,research,codegen,database,dev]",
]

[project.urls]
Homepage = "https://github.com/Pkanna10/autonomous-ai-platform"
Documentation = "https://github.com/Pkanna10/autonomous-ai-platform/blob/master/CLAUDE.md"
Repository = "https://github.com/Pkanna10/autonomous-ai-platform"
Issues = "https://github.com/Pkanna10/autonomous-ai-platform/issues"
Changelog = "https://github.com/Pkanna10/autonomous-ai-platform/blob/master/CLAUDE.md#project-changelog"

# ============================================
# CLI Scripts (Proposal #16)
# ============================================
[project.scripts]
research-agent = "autonomous_ai_agents.cli:research_main"
orchestrator-agent = "autonomous_ai_agents.cli:orchestrator_main"

# ============================================
# Package Discovery (Hatchling Configuration)
# ============================================
# Hatchling automatically discovers packages in src/ layout
# No explicit configuration needed for standard structure
[tool.hatchling.build.targets.wheel]
packages = ["src/autonomous_ai_agents"]

# ============================================
# Ruff Configuration (Linting & Formatting)
# ============================================
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "B",  # flake8-bugbear
    "Q",  # flake8-quotes
    "UP", # pyupgrade
]
ignore = ["E501"] # Line too long (handled by formatter)

[tool.ruff.lint.isort]
known-first-party = ["autonomous_ai_agents"]

# ============================================
# Ruff Formatter Configuration (Proposal #2)
# Replaces Black - 30x faster, 100% compatible
# ============================================
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

# ============================================
# mypy Configuration (Tier 3: Strict Mode Enabled)
# ============================================
# Proposal #3: Enable strict mode for maximum type safety
# May require code fixes (2-4 hours), but prevents runtime type errors
[tool.mypy]
python_version = "3.11"

# Strict mode flags (Tier 3)
strict = true                           # Enable all strict flags
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true      # Changed from false to true (strict mode)
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

# Additional strict checks
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
warn_unreachable = true
no_implicit_reexport = true

# Pydantic plugin for dataclass type checking
plugins = ["pydantic.mypy"]

# Library stubs that don't have type hints
[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain.*", "arxiv.*", "sentence_transformers.*"]
ignore_missing_imports = true

# ============================================
# pytest Configuration (Proposal 3)
# ============================================
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--import-mode=importlib", # Modern mode (no __init__.py in tests needed)
    "--strict-markers",
    "--strict-config",
    "-ra",                      # Show all test summary info
    "-q",                       # Quiet mode
    # Coverage flags (Proposal #10: Enforce 90% minimum)
    "--cov=autonomous_ai_agents",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=90",      # Fail if coverage below 90%
]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: marks tests as unit tests (fast, isolated)",
]
asyncio_mode = "auto"

# Coverage configuration
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# ============================================
# UV Configuration (Tier 3: Proposal #14)
# ============================================
# UV: 10-100x faster than pip (8-10x without cache, 80-115x with warm cache)
# Research: 13 comprehensive web searches, official benchmarks
[tool.uv]
# Use UV's fast dependency resolver
index-url = "https://pypi.org/simple"

# Enable global cache for maximum performance
cache-dir = "~/.cache/uv"

# Use system Python (skip Python download)
python-preference = "system"

# Compile Python bytecode during install (faster startup)
compile-bytecode = true

# No build isolation for faster builds (use with caution)
no-build-isolation = false

# Link mode for faster installations (symlink when possible)
link-mode = "copy"

# ============================================
# UV Workspace Configuration (Tier 4: Proposal #18)
# ============================================
# Enables shared dependencies across Python monorepo packages
# 3-5x faster than separate virtual environments
[tool.uv.workspace]
members = [
    "orchestrator",
    "research",
    "code_generator",
]

# Shared development dependencies inherited by all workspace members
# Future: When splitting into multiple packages

# ============================================
# Hatch Environment Configuration (Optional)
# ============================================
# Alternative to UV workspace for development environments
# Uncomment if using hatch for environment management
# [tool.hatch.envs.default]
# dependencies = [
#     "coverage[toml]>=6.2",
#     "pytest",
#     "pytest-cov",
# ]
# [tool.hatch.envs.default.scripts]
# test = "pytest {args:tests}"
# test-cov = "coverage run -m pytest {args:tests}"
# cov-report = ["coverage combine", "coverage report"]

# ============================================
# Plugin System (Tier 5: Proposal #17)
# ============================================
# Entry points for plugin architecture (Phase 4, Week 25-36)
# Allows external packages to register agents/tools/integrations
[project.entry-points."autonomous_ai_agents.agents"]
# Built-in agents
orchestrator = "autonomous_ai_agents.orchestrator:OrchestratorAgent"
research = "autonomous_ai_agents.research:ResearchAgent"
code_generator = "autonomous_ai_agents.codegen:CodeGeneratorAgent"

[project.entry-points."autonomous_ai_agents.tools"]
# Built-in tools
package_search = "autonomous_ai_agents.tools.package_search:PackageSearchTool"
arxiv_search = "autonomous_ai_agents.tools.arxiv_search:ArxivSearchTool"
code_analyzer = "autonomous_ai_agents.tools.code_analyzer:CodeAnalyzerTool"

[project.entry-points."autonomous_ai_agents.integrations"]
# Built-in integrations (Phase 4)
github = "autonomous_ai_agents.integrations.github:GitHubIntegration"
gitlab = "autonomous_ai_agents.integrations.gitlab:GitLabIntegration"
docker = "autonomous_ai_agents.integrations.docker:DockerIntegration"

# ============================================
# Lazy Import Configuration (Tier 4: Proposal #15)
# ============================================
# Documentation for implementing lazy imports in code
# See: autonomous_ai_agents/utils/lazy_import.py
#
# Pattern for heavy dependencies (>500ms import time):
# ```python
# # Type checking imports (zero runtime cost)
# from typing import TYPE_CHECKING
#
# if TYPE_CHECKING:
#     from anthropic import Anthropic
#     from langgraph.graph import StateGraph
#
# # Runtime lazy import
# def get_claude_client() -> "Anthropic":
#     from anthropic import Anthropic
#     return Anthropic(api_key=os.getenv("ANTHROPIC_API_KEY"))
# ```
#
# Expected Impact:
# - CLI startup time: 3s → 0.5s (6x faster)
# - Memory footprint: 500MB → 100MB (for CLI utilities)
# - Trade-off: First ML operation 100-200ms slower (one-time cost)
