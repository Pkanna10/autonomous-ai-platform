# ============================================
# Build System Configuration
# ============================================
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# ============================================
# Project Metadata
# ============================================
[project]
name = "autonomous-ai-agents"
version = "0.1.0"
description = "LangGraph orchestrator and research agents for autonomous AI platform"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Praveen Kanna" }]
maintainers = [{ name = "Praveen Kanna" }]
keywords = [
    "ai",
    "agents",
    "langgraph",
    "langchain",
    "anthropic",
    "research",
    "autonomous",
    "claude",
    "llm",
    "multi-agent",
    "orchestration",
    "arxiv",
    "pdf-parsing",
    "code-generation",
    "self-improving",
]
classifiers = [
    # Development Status
    "Development Status :: 3 - Alpha",
    # Intended Audience
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    # License
    "License :: OSI Approved :: MIT License",
    # Natural Language
    "Natural Language :: English",
    # Operating System
    "Operating System :: OS Independent",
    # Programming Language
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    # Framework
    "Framework :: LangChain",
    # Topics
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Text Processing :: Markup :: Markdown",
    # Typing
    "Typing :: Typed",
]

dependencies = [
    # Core dependencies (Phase 1, Week 3-4: Orchestrator)
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "anthropic>=0.68.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
# Research dependencies (Phase 1, Week 7-8)
# Install with: pip install -e ".[research]"
research = [
    "pymupdf>=1.25.0",  # PDF parsing for research papers
    "arxiv>=2.1.0",     # arXiv API client (has dependency issues, defer until needed)
]

# Development dependencies
dev = [
    # Testing
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.5.0",      # Parallel test execution
    "pytest-timeout>=2.2.0",    # Test timeout enforcement
    # Type checking
    "mypy>=1.13.0",
    "types-requests",
    # Linting & formatting
    "ruff>=0.8.0",
    # Security scanning
    "pip-audit>=2.7.0",         # PyPA official vulnerability scanner
    "bandit[toml]>=1.7.0",      # SAST security linter
    "safety>=3.0.0",            # Dependency security checker
]

# All dependencies (orchestrator + research + dev)
# Install with: pip install -e ".[all]"
all = [
    "autonomous-ai-agents[research,dev]",
]

[project.urls]
Homepage = "https://github.com/Pkanna10/autonomous-ai-platform"
Documentation = "https://github.com/Pkanna10/autonomous-ai-platform/blob/master/CLAUDE.md"
Repository = "https://github.com/Pkanna10/autonomous-ai-platform"
Issues = "https://github.com/Pkanna10/autonomous-ai-platform/issues"
Changelog = "https://github.com/Pkanna10/autonomous-ai-platform/blob/master/CLAUDE.md#project-changelog"

# ============================================
# CLI Scripts (Proposal #16)
# ============================================
[project.scripts]
research-agent = "autonomous_ai_agents.cli:research_main"
orchestrator-agent = "autonomous_ai_agents.cli:orchestrator_main"

# ============================================
# Package Discovery (Proposal 4)
# ============================================
[tool.setuptools.packages.find]
where = ["src"]
include = ["autonomous_ai_agents*"]
exclude = ["*.tests", "*.tests.*", "tests.*", "tests"]
namespaces = false # Require explicit __init__.py files

# ============================================
# Ruff Configuration (Linting & Formatting)
# ============================================
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "B",  # flake8-bugbear
    "Q",  # flake8-quotes
    "UP", # pyupgrade
]
ignore = ["E501"] # Line too long (handled by formatter)

[tool.ruff.lint.isort]
known-first-party = ["autonomous_ai_agents"]

# ============================================
# Ruff Formatter Configuration (Proposal #2)
# Replaces Black - 30x faster, 100% compatible
# ============================================
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

# ============================================
# mypy Configuration (Type Checking)
# ============================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain.*", "arxiv.*"]
ignore_missing_imports = true

# ============================================
# pytest Configuration (Proposal 3)
# ============================================
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--import-mode=importlib", # Modern mode (no __init__.py in tests needed)
    "--strict-markers",
    "--strict-config",
    "-ra",                      # Show all test summary info
    "-q",                       # Quiet mode
    # Coverage flags (Proposal #10: Enforce 90% minimum)
    "--cov=autonomous_ai_agents",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=90",      # Fail if coverage below 90%
]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: marks tests as unit tests (fast, isolated)",
]
asyncio_mode = "auto"

# Coverage configuration
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
