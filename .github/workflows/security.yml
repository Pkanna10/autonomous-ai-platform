name: Security Scans

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    # Run security scans every Monday at 9am UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  # OSV-Scanner - Google's free vulnerability scanner (reusable workflow)
  # Note: SARIF upload disabled for private repo (requires paid GHAS)
  osv-scanner:
    name: OSV Vulnerability Scan
    permissions:
      contents: read
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.2.4
    with:
      scan-args: |-
        --recursive
        --skip-git
        ./
      upload-sarif: false
      fail-on-vuln: false

  # OSV-Scanner with custom reporting (enhanced visibility for private repos)
  osv-scanner-summary:
    name: OSV Scanner Report
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install OSV-Scanner CLI
        run: |
          curl -L https://github.com/google/osv-scanner/releases/latest/download/osv-scanner-linux-amd64 -o osv-scanner
          chmod +x osv-scanner
          sudo mv osv-scanner /usr/local/bin/

      - name: Run OSV-Scanner
        run: osv-scanner scan --format json --recursive --skip-git ./ > osv-results.json || true

      - name: Generate Job Summary
        run: |
          echo "# 🔍 OSV-Scanner Vulnerability Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          VULN_COUNT=$(jq '[.results[].packages[].vulnerabilities[]] | length' osv-results.json)

          if [ "$VULN_COUNT" -eq 0 ]; then
            echo "✅ **No vulnerabilities found!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Found $VULN_COUNT vulnerabilities**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Package | Ecosystem | Vulnerability | Details |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|-----------|---------------|---------|" >> $GITHUB_STEP_SUMMARY

            jq -r '.results[].packages[] | select(.vulnerabilities | length > 0) | .package.name as $pkg | .package.ecosystem as $eco | .vulnerabilities[] | "| \($pkg) | \($eco) | \(.id) | [Link](https://osv.dev/vulnerability/\(.id)) |"' osv-results.json >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload OSV results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osv-scanner-results
          path: osv-results.json
          retention-days: 30

  # Socket.dev supply chain security (FREE for open source, PR-only)
  # NOTE: This job intentionally only runs on pull requests (not direct pushes)
  # to catch malicious dependencies before they're merged into main branch.
  socket:
    name: Socket.dev Supply Chain Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Socket.dev Dependency Analysis
        uses: SocketDev/socket-security-action@v1
        continue-on-error: true
        with:
          api-key: ${{ secrets.SOCKET_API_KEY }}
          comment-as-user: true

  # npm audit (built-in, free)
  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: |
          pnpm audit --audit-level=high --json > npm-audit.json || true

      - name: Parse and display audit results
        run: |
          echo "# 📦 npm Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f npm-audit.json ]; then
            CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' npm-audit.json)
            HIGH=$(jq '.metadata.vulnerabilities.high // 0' npm-audit.json)
            MODERATE=$(jq '.metadata.vulnerabilities.moderate // 0' npm-audit.json)
            LOW=$(jq '.metadata.vulnerabilities.low // 0' npm-audit.json)

            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🔴 Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟠 High | $HIGH |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟡 Moderate | $MODERATE |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟢 Low | $LOW |" >> $GITHUB_STEP_SUMMARY

            if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "⚠️ **Action Required:** Critical or High severity vulnerabilities detected!" >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
          fi

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-results
          path: npm-audit.json
          retention-days: 30

  # License compliance check
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check licenses
        run: |
          npx license-checker --json > licenses.json
          npx license-checker --summary

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: licenses.json
          retention-days: 90
