name: Security Scans

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    # Run security scans every Monday at 9am UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

# Least privilege by default; a job that needs more says so itself.
permissions:
  contents: read

# Concurrency: Cancel in-progress runs for PR branches, keep all runs for main
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  # OSV-Scanner - Google's free vulnerability scanner (reusable workflow)
  osv-scanner:
    name: OSV Vulnerability Scan
    # The reusable workflow's documented minimum. upload-sarif stays false:
    # every advisory it would upload already exists as a Dependabot alert, so
    # a SARIF copy per run would double the counts in the Security tab.
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    # No --skip-git: osv-scanner 2.x has no such flag (it aborted with "flag
    # provided but not defined", so every earlier run reported "No issues
    # found" without scanning); 2.x skips git history by default.
    with:
      scan-args: |-
        --recursive
        ./
      upload-sarif: false
      fail-on-vuln: false

  # OSV-Scanner with custom reporting (a per-package table in the job summary)
  osv-scanner-summary:
    name: OSV Scanner Report
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The scanner's own pinned action (a versioned container) replaces the
      # old `curl .../releases/latest ... && sudo mv` install: that ran an
      # unverified, floating binary as root on every push. The container is
      # the same one the reusable workflow above runs. Exit code 1 means
      # findings, which the summary step reports.
      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=osv-results.json
            --recursive
            ./

      - name: Generate Job Summary
        run: |
          {
            echo "# 🔍 OSV-Scanner Vulnerability Report"
            echo ""
            if [ ! -s osv-results.json ]; then
              echo "❌ **The scanner produced no results file** (see the scan step)."
              exit 1
            fi

            VULN_COUNT=$(jq '[.results[]?.packages[]?.vulnerabilities[]?] | length' osv-results.json)

            if [ "$VULN_COUNT" -eq 0 ]; then
              echo "✅ **No vulnerabilities found!**"
            else
              echo "⚠️ **Found $VULN_COUNT vulnerabilities**"
              echo ""
              echo "| Package | Ecosystem | Vulnerability | Details |"
              echo "|---------|-----------|---------------|---------|"
              jq -r '.results[]?.packages[]? | select(.vulnerabilities | length > 0) | .package.name as $pkg | .package.ecosystem as $eco | .vulnerabilities[] | "| \($pkg) | \($eco) | \(.id) | [Link](https://osv.dev/vulnerability/\(.id)) |"' osv-results.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload OSV results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: osv-scanner-results
          path: osv-results.json
          retention-days: 14
          compression-level: 6

  # npm audit with optimized configuration
  npm-audit:
    name: npm Audit
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: |
          pnpm audit --audit-level=high --json > npm-audit.json || true

      - name: Parse and display audit results
        run: |
          {
            echo "# 📦 npm Audit Results"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f npm-audit.json ]; then
            CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' npm-audit.json)
            HIGH=$(jq '.metadata.vulnerabilities.high // 0' npm-audit.json)
            MODERATE=$(jq '.metadata.vulnerabilities.moderate // 0' npm-audit.json)
            LOW=$(jq '.metadata.vulnerabilities.low // 0' npm-audit.json)

            {
              echo "| Severity | Count |"
              echo "|----------|-------|"
              echo "| 🔴 Critical | $CRITICAL |"
              echo "| 🟠 High | $HIGH |"
              echo "| 🟡 Moderate | $MODERATE |"
              echo "| 🟢 Low | $LOW |"
            } >> "$GITHUB_STEP_SUMMARY"

            if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
              {
                echo ""
                echo "⚠️ **Action Required:** Critical or High severity vulnerabilities detected!"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi

      - name: Upload audit results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: npm-audit-results
          path: npm-audit.json
          retention-days: 14
          compression-level: 6

  # pip-audit (spec D19). The python job in ci.yml audits the synced
  # environment on every Python PR; this weekly run repeats that with the same
  # sync and command, then audits every package in uv.lock, the extras CI
  # never installs included (research, codegen, package-manager), from an
  # exported, hash-pinned list and without installing it.
  pip-audit:
    name: pip-audit (Python lock)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./services/python_agents
    env:
      UV_PYTHON: '3.11'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: '0.11.32'

      - name: Install dependencies with uv sync
        run: uv sync --frozen --extra dev --extra database --extra experiments

      - name: Audit dependencies with pip-audit
        run: uv run pip-audit --progress-spinner off

      - name: Audit every locked package with pip-audit
        run: |
          uv export --frozen --all-extras --no-emit-project -o "${RUNNER_TEMP}/locked.txt"
          uv run pip-audit --progress-spinner off --disable-pip --require-hashes -r "${RUNNER_TEMP}/locked.txt"

  # License compliance check
  license-check:
    name: License Compliance
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm exec runs the locked devDependency; npx would fall back to
      # fetching a package of that name from the registry.
      - name: Check licenses
        run: |
          pnpm exec license-checker --json > licenses.json
          pnpm exec license-checker --summary

      - name: Upload license report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: license-report
          path: licenses.json
          retention-days: 30
          compression-level: 6

  # Static analysis of the workflows themselves (unpinned actions, template
  # injection, credential persistence, excessive permissions). Fails on any
  # finding of low severity or above, so a regression cannot merge.
  workflow-lint:
    name: Workflow lint (zizmor)
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.32'

      # The read-only job token lets the impostor-commit and known-vulnerable
      # -actions audits query the GitHub API; it never leaves the runner.
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx --from zizmor==1.22.0 zizmor --persona regular --min-severity low --format github .github/workflows
