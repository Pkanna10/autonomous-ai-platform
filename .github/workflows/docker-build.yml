name: Docker Build & Push

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

# Least privilege by default; the two build jobs add packages: write for the
# registry push themselves. No job uploads SARIF, so none needs
# security-events: write.
permissions:
  contents: read

# Concurrency: Cancel in-progress runs for PR branches, keep all runs for main
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

env:
  REGISTRY: ghcr.io
  # Docker registry references MUST be lowercase - using hardcoded lowercase owner
  IMAGE_BASE: ghcr.io/pkanna10/autonomous-ai-platform

jobs:
  # Build Node.js services with BuildKit cache optimization
  build-node:
    name: Build Node.js Services
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        service:
          - name: agent-core
            scope: '@autonomous-ai/agent-core'
            type: library
            context: .
            dockerfile: infrastructure/docker/Dockerfile.node
          - name: research-engine
            scope: '@autonomous-ai/research-engine'
            type: library
            context: .
            dockerfile: infrastructure/docker/Dockerfile.node
          - name: execution-engine
            scope: '@autonomous-ai/execution-engine'
            type: library
            context: .
            dockerfile: infrastructure/docker/Dockerfile.node

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The action's default BuildKit image (pinned per release) instead of
      # the mutable moby/buildkit:latest.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: |
            network=host

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Build and push Docker image with optimized caching
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          target: production
          build-args: |
            PACKAGE_SCOPE=${{ matrix.service.scope }}
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            GIT_COMMIT=${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache strategy: GHA only for PRs, GHA + Registry for pushes (avoids 403 auth errors in PRs)
          cache-from: |
            type=gha,scope=node-${{ matrix.service.name }}
            ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}:buildcache', env.IMAGE_BASE, matrix.service.name) || '' }}
          cache-to: type=gha,mode=max,ignore-error=true,scope=node-${{ matrix.service.name }}
          provenance: true
          sbom: true

      # Scan built image immediately (no rebuild needed)
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: github.event_name != 'pull_request'
        with:
          image-ref: ${{ env.IMAGE_BASE }}/${{ matrix.service.name }}:${{ steps.meta.outputs.version }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      # Build distroless variant for maximum security
      - name: Build distroless variant
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          target: production-distroless
          build-args: |
            PACKAGE_SCOPE=${{ matrix.service.scope }}
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            GIT_COMMIT=${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}-distroless
          labels: ${{ steps.meta.outputs.labels }}
          # Cache strategy: GHA only for PRs, GHA + Registry for pushes (avoids 403 auth errors in PRs)
          cache-from: |
            type=gha,scope=node-distroless-${{ matrix.service.name }}
            ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}:buildcache-distroless', env.IMAGE_BASE, matrix.service.name) || '' }}
          cache-to: type=gha,mode=max,ignore-error=true,scope=node-distroless-${{ matrix.service.name }}

  # Test Docker images (run healthchecks and basic smoke tests)
  test-docker:
    name: Test Docker Images
    runs-on: ubuntu-22.04
    needs: build-node
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    strategy:
      matrix:
        service:
          - name: agent-core
            type: library
          - name: research-engine
            type: library
          - name: execution-engine
            type: library

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infrastructure/docker/Dockerfile.node
          target: testing
          build-args: |
            PACKAGE_SCOPE=@autonomous-ai/${{ matrix.service.name }}
          load: true
          tags: ${{ matrix.service.name }}:test
          cache-from: type=gha,scope=node-${{ matrix.service.name }}

      - name: Verify tests passed during build
        run: |
          echo "✅ Tests completed during Docker build"
          echo "The 'testing' target runs:"
          echo "  - pnpm run lint"
          echo "  - pnpm run typecheck"
          echo "  - pnpm run test"
          echo "All checks passed successfully!"

      - name: Build production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infrastructure/docker/Dockerfile.node
          target: production
          build-args: |
            PACKAGE_SCOPE=@autonomous-ai/${{ matrix.service.name }}
          load: true
          tags: ${{ matrix.service.name }}:prod
          cache-from: type=gha,scope=node-${{ matrix.service.name }}

      # Workflow values reach the script through env, never through ${{ }}
      # inside run: (no script injection).
      - name: Validate library package
        if: matrix.service.type == 'library'
        env:
          SERVICE_NAME: ${{ matrix.service.name }}
        run: |
          {
            echo "## 📦 Library Package Validation - ${SERVICE_NAME}"
            echo ""
            echo "### ✅ Build-Time Tests (Already Passed)"
            echo "- Linting (\`pnpm run lint\`)"
            echo "- Type checking (\`pnpm run typecheck\`)"
            echo "- Unit tests (\`pnpm run test\`)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          docker run -d --name test-container \
            -e NODE_ENV=production \
            -e PORT=3000 \
            "${SERVICE_NAME}:prod"

          sleep 10
          status=$(docker inspect test-container --format='{{.State.Health.Status}}' 2>/dev/null || echo "none")

          if [ "$status" = "healthy" ]; then
            echo "✅ Healthcheck passed" >> "$GITHUB_STEP_SUMMARY"
            docker stop test-container
            exit 0
          else
            echo "❌ Healthcheck failed" >> "$GITHUB_STEP_SUMMARY"
            docker logs test-container
            docker stop test-container
            exit 1
          fi

  # Build Python services with optimized multi-platform builds
  build-python:
    name: Build Python Services
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: python-agents
            context: .
            dockerfile: services/python_agents/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # QEMU for multi-platform builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: |
            network=host

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
          labels: |
            org.opencontainers.image.title=Python AI Agents
            org.opencontainers.image.description=LangGraph-powered autonomous AI agents
            org.opencontainers.image.vendor=Autonomous AI Platform
            org.opencontainers.image.licenses=MIT
            maintainer=${{ github.actor }}

      # Build multi-platform image with optimized caching
      - name: Build and push Python Docker image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            GIT_COMMIT=${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache strategy: GHA only for PRs, GHA + Registry for pushes (avoids 403 auth errors in PRs)
          cache-from: |
            type=gha,scope=${{ github.workflow }}-${{ matrix.service.name }}
            ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}:buildcache', env.IMAGE_BASE, matrix.service.name) || '' }}
          cache-to: type=gha,mode=max,ignore-error=true,scope=${{ github.workflow }}-${{ matrix.service.name }}
          provenance: mode=max
          sbom: true

      # No actions/cache for the Trivy database here: this job publishes
      # images, and a restored cache is writable state another run could have
      # planted (zizmor cache-poisoning). A fresh database also means the scan
      # never runs on stale advisories.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: github.event_name != 'pull_request'
        with:
          image-ref: ${{ env.IMAGE_BASE }}/${{ matrix.service.name }}@${{ steps.build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service.name }}.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          vuln-type: 'os,library'
          ignore-unfixed: true
          timeout: 5m

      # Upload scan results as artifact
      - name: Upload Trivy Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: trivy-python-scan-${{ github.run_number }}
          path: trivy-results-${{ matrix.service.name }}.sarif
          retention-days: 14
          compression-level: 6

      # Generate security summary. Workflow values reach the script through
      # env, never through ${{ }} inside run: (the tag list derives from the
      # branch name, which is attacker-chosen on a pull request).
      - name: Generate security summary
        if: always()
        env:
          SERVICE_NAME: ${{ matrix.service.name }}
          IMAGE_NAME: ${{ env.IMAGE_BASE }}/${{ matrix.service.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "# 🔒 Python Docker Image Security Scan - ${SERVICE_NAME}"
            echo ""
            echo "## Build Information"
            echo "- **Image:** \`${IMAGE_NAME}\`"
            echo "- **Digest:** \`${IMAGE_DIGEST}\`"
            echo "- **Platforms:** linux/amd64, linux/arm64"
            echo ""
            echo "## Tags Generated"
            echo "\`\`\`"
            echo "${IMAGE_TAGS}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
