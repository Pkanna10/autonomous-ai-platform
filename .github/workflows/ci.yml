name: CI

on:
  pull_request:
  push:
    branches: [master, main]

# Concurrency: Cancel in-progress runs for PR branches, keep all runs for main
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  # Detect which packages changed for selective execution
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read # Required for paths-filter to access PR information
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      python: ${{ steps.filter.outputs.python }}
      workflows: ${{ steps.filter.outputs.workflows }}
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            typescript:
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - '.nvmrc'
              - 'turbo.json'
              - 'tsconfig*.json'
            python:
              - 'services/python_agents/**'
              - 'services/python_agents/pyproject.toml'
            workflows:
              - '.github/workflows/**'
            infrastructure:
              - 'infrastructure/schema/**'
              - 'docker-compose.dev.yml'

  # Shared setup for TypeScript jobs
  setup-typescript:
    name: Setup TypeScript Environment
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.typescript == 'true' ||
      needs.detect-changes.outputs.workflows == 'true' ||
      github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  # Parallel TypeScript checks
  typecheck:
    name: Type Check
    runs-on: ubuntu-22.04
    needs: setup-typescript
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

  lint:
    name: Lint Code
    runs-on: ubuntu-22.04
    needs: setup-typescript
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check (with auto-fix attempt)
        id: format-check
        run: |
          # Step 1: Check formatting
          if pnpm format:check; then
            echo "✅ All files properly formatted"
            exit 0
          fi

          # Step 2: Formatting issues found, attempt auto-fix
          echo "⚠️ Formatting issues found, attempting auto-fix..."
          pnpm format

          # Step 3: Re-check after auto-fix
          if pnpm format:check; then
            echo "✅ Auto-fix successful, but changes were made"
            echo "⚠️ This indicates formatting issues in committed code"
            exit 1
          else
            echo "❌ Auto-fix failed, manual intervention required"
            exit 1
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-22.04
    needs: setup-typescript
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Check coverage threshold
        run: pnpm test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ./coverage
          retention-days: 14
          compression-level: 6

  # Python CI with optimizations
  python:
    name: Python CI
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.python == 'true' ||
      needs.detect-changes.outputs.workflows == 'true' ||
      github.event_name == 'push'
    defaults:
      run:
        working-directory: ./services/python_agents

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv (fast Python package installer)
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Install dependencies with uv sync
        run: |
          uv sync --frozen --extra dev

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Format check with Ruff
        run: uv run ruff format --check .

      - name: Type check with Mypy
        run: |
          if find . -name "*.py" -type f | grep -q .; then
            uv run mypy .
          else
            echo "No Python files found, skipping mypy"
          fi
        continue-on-error: true

      - name: Run tests with parallelization
        run: uv run pytest -n auto --cov --cov-report=xml --cov-report=term
        if: hashFiles('services/python_agents/tests/**/*.py') != ''

  # Database schema: apply every migration to a real Postgres, then re-apply the
  # newest one to prove it is idempotent (same image as docker-compose.dev.yml)
  schema-apply:
    name: Schema Apply (Postgres)
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.infrastructure == 'true' ||
      needs.detect-changes.outputs.workflows == 'true' ||
      github.event_name == 'push'
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_platform
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: devpass
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U dev -d ai_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure psql is available
        run: which psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      # Same order as docker-entrypoint-initdb.d on a fresh volume (file name order)
      - name: Apply migrations in order (001 -> 002 -> 003)
        run: |
          for file in infrastructure/schema/*.sql; do
            echo "::group::${file}"
            PGPASSWORD=devpass psql -h localhost -U dev -d ai_platform -v ON_ERROR_STOP=1 -f "${file}"
            echo "::endgroup::"
          done

      - name: Snapshot schema catalog before the second run
        run: |
          snapshot() {
            PGPASSWORD=devpass psql -h localhost -U dev -d ai_platform -tAc "SELECT conrelid::regclass, conname, pg_get_constraintdef(oid) FROM pg_constraint WHERE connamespace = 'public'::regnamespace ORDER BY 1, 2" > "$1"
            PGPASSWORD=devpass psql -h localhost -U dev -d ai_platform -tAc "SELECT tablename, indexname, indexdef FROM pg_indexes WHERE schemaname = 'public' ORDER BY 1, 2" >> "$1"
            PGPASSWORD=devpass psql -h localhost -U dev -d ai_platform -tAc "SELECT table_name, column_name, data_type, is_nullable, column_default FROM information_schema.columns WHERE table_schema = 'public' ORDER BY 1, 2" >> "$1"
          }
          snapshot /tmp/schema-before.txt

      - name: Re-apply 003 (idempotence proof)
        run: |
          PGPASSWORD=devpass psql -h localhost -U dev -d ai_platform -v ON_ERROR_STOP=1 -f infrastructure/schema/003_engine.sql

      - name: Second run changed nothing (no duplicated constraints or indexes)
        run: |
          snapshot() {
            PGPASSWORD=devpass psql -h localhost -U dev -d ai_platform -tAc "SELECT conrelid::regclass, conname, pg_get_constraintdef(oid) FROM pg_constraint WHERE connamespace = 'public'::regnamespace ORDER BY 1, 2" > "$1"
            PGPASSWORD=devpass psql -h localhost -U dev -d ai_platform -tAc "SELECT tablename, indexname, indexdef FROM pg_indexes WHERE schemaname = 'public' ORDER BY 1, 2" >> "$1"
            PGPASSWORD=devpass psql -h localhost -U dev -d ai_platform -tAc "SELECT table_name, column_name, data_type, is_nullable, column_default FROM information_schema.columns WHERE table_schema = 'public' ORDER BY 1, 2" >> "$1"
          }
          snapshot /tmp/schema-after.txt
          diff -u /tmp/schema-before.txt /tmp/schema-after.txt

      - name: Verify engine tables and columns
        run: |
          query() {
            PGPASSWORD=devpass psql -h localhost -U dev -d ai_platform -v ON_ERROR_STOP=1 -tAc "$1"
          }
          status=0
          for table in projects workloads objectives guardrails techniques hotspots hypotheses lessons; do
            if [ "$(query "SELECT to_regclass('public.${table}') IS NOT NULL")" = "t" ]; then
              echo "table ${table}: present"
            else
              echo "::error::table ${table} is missing"
              status=1
            fi
          done
          for column in claims citation_count; do
            if [ "$(query "SELECT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'research_papers' AND column_name = '${column}')")" = "t" ]; then
              echo "column research_papers.${column}: present"
            else
              echo "::error::column research_papers.${column} is missing"
              status=1
            fi
          done
          exit "${status}"

  # Database init exactly as a developer runs it: docker compose starts the
  # postgres service on an empty volume, the image's entrypoint applies every
  # file mounted at /docker-entrypoint-initdb.d, and the result must be a
  # healthy database with the 14 engine tables and no error in the init log.
  compose-init:
    name: Compose Init (Postgres)
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.infrastructure == 'true' ||
      needs.detect-changes.outputs.workflows == 'true' ||
      github.event_name == 'push'
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      COMPOSE_FILE: docker-compose.dev.yml

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start postgres on an empty volume
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up -d postgres

      - name: Wait for the healthcheck
        run: |
          container="$(docker compose ps -q postgres)"
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "${container}")"
            if [ "${status}" = "healthy" ]; then
              echo "postgres is healthy"
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Status}}' "${container}")" != "running" ]; then
              echo "::error::postgres container stopped during init"
              docker compose logs postgres
              exit 1
            fi
            sleep 2
          done
          echo "::error::postgres did not become healthy in 120 s"
          docker compose logs postgres
          exit 1

      - name: Init log has no errors
        run: |
          docker compose logs postgres > /tmp/postgres-init.log
          if grep -iE '(^|[^a-z])(error|fatal)([^a-z]|$)' /tmp/postgres-init.log; then
            echo "::error::postgres init log contains errors (see above)"
            exit 1
          fi
          echo "init log is clean ($(wc -l < /tmp/postgres-init.log) lines)"

      - name: Database has the 14 engine tables
        run: |
          count="$(docker compose exec -T postgres psql -U dev -d ai_platform -tAc \
            "select count(*) from pg_tables where schemaname = 'public'")"
          echo "public tables: ${count}"
          docker compose exec -T postgres psql -U dev -d ai_platform -c '\dt'
          if [ "${count}" != "14" ]; then
            echo "::error::expected 14 tables after 001 -> 002 -> 003, found ${count}"
            exit 1
          fi

      - name: Tear down (volume included)
        if: always()
        run: docker compose down -v --remove-orphans

  # Dependency security scan (optimized)
  security:
    name: Security Scan
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.typescript == 'true' ||
      needs.detect-changes.outputs.workflows == 'true' ||
      github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

  # Docker security scan (optimized with Trivy caching)
  docker-security:
    name: Docker Security Scan
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Cache Trivy database for 40-50% speedup
      - name: Cache Trivy Database
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      # Consolidated single scan (70% faster than 3 separate scans)
      - name: Run Trivy - All Severities
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          exit-code: '0'

      # Process results and generate reports
      - name: Process Trivy Results
        if: always()
        run: |
          # Extract HIGH/CRITICAL issues
          if [ -f trivy-results.json ]; then
            jq '.Results[] | select(.Misconfigurations != null) | .Misconfigurations[] | select(.Severity == "CRITICAL" or .Severity == "HIGH")' trivy-results.json > high-critical.json || echo "[]" > high-critical.json

            # Extract MEDIUM/LOW issues
            jq '.Results[] | select(.Misconfigurations != null) | .Misconfigurations[] | select(.Severity == "MEDIUM" or .Severity == "LOW")' trivy-results.json > medium-low.json || echo "[]" > medium-low.json

            # Count issues
            HIGH_CRITICAL_COUNT=$(jq -s 'length' high-critical.json)
            MEDIUM_LOW_COUNT=$(jq -s 'length' medium-low.json)

            echo "HIGH_CRITICAL_COUNT=$HIGH_CRITICAL_COUNT" >> $GITHUB_ENV
            echo "MEDIUM_LOW_COUNT=$MEDIUM_LOW_COUNT" >> $GITHUB_ENV
          fi

      # Upload optimized artifacts
      - name: Upload Trivy Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-security-scan-${{ github.run_number }}
          path: |
            trivy-results.json
            high-critical.json
            medium-low.json
          retention-days: 14
          compression-level: 6

      # Enhanced security summary
      - name: Generate Security Summary
        if: always()
        run: |
          echo "# 🔒 Trivy Security Scan Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Status badge
          if [ "${HIGH_CRITICAL_COUNT:-0}" -gt 0 ]; then
            echo "![Status](https://img.shields.io/badge/Security-FAILED-red?style=for-the-badge&logo=security)" >> $GITHUB_STEP_SUMMARY
          elif [ "${MEDIUM_LOW_COUNT:-0}" -gt 0 ]; then
            echo "![Status](https://img.shields.io/badge/Security-WARNING-yellow?style=for-the-badge&logo=security)" >> $GITHUB_STEP_SUMMARY
          else
            echo "![Status](https://img.shields.io/badge/Security-PASSED-brightgreen?style=for-the-badge&logo=security)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 CRITICAL/HIGH | ${HIGH_CRITICAL_COUNT:-0} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 MEDIUM/LOW | ${MEDIUM_LOW_COUNT:-0} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📅 **Scan Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "📦 **Repository:** \`${{ github.repository }}\`" >> $GITHUB_STEP_SUMMARY
          echo "🌿 **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY

      # FAIL if CRITICAL/HIGH found
      - name: Check for HIGH/CRITICAL Vulnerabilities
        if: always()
        run: |
          if [ "${HIGH_CRITICAL_COUNT:-0}" -gt 0 ]; then
            echo "❌ Found ${HIGH_CRITICAL_COUNT} CRITICAL/HIGH severity issues!"
            echo "Please review the security scan results above."
            exit 1
          else
            echo "✅ No CRITICAL/HIGH severity vulnerabilities found."
          fi
