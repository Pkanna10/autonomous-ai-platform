            export LIVE_SWEEP_ARMS=sonnet-5-5-medium LIVE_SWEEP_RECORD=1
          fi
          if [ "${INPUT_SUITE}" = heal-hard ]; then
            # the harder bugs: wrong-place causes, misleading reports, controls
            export LIVE_HEAL_SET=hard
          fi
          if [ "${INPUT_SUITE}" = watch-cleanup ]; then
            # A3 (P3): no hosted run, only the cleanup and its listing check
            export LIVE_WATCH_CANCEL=1
          fi
          if [ "${INPUT_SUITE}" = evolve-more ]; then
            # the four other libraries the OSS A/B improved
            export LIVE_EVOLVE_REPOS=idna,mistune,sqlparse,pycparser
          fi
          if [ "${INPUT_SUITE}" = ab-v2-p ]; then
            # E3 (V8): arm P beside arm A on v2's deep, misleading, uncommon
            export LIVE_AB_SET=v2-p
          fi
          # The retrieval re-test (V10, spec D2): ab-v2 runs arms A and B on
          # all twelve corpus v2 repositories, 2 reps (L5b, need 68); ab_arms A
          # runs arm A alone, 1 rep (L5a, need 17: phase 1 and A's request
          # share a 0.35 USD run). An unset input (an older caller) reads as
          # A,B, an empty one is refused.
          ab_arms="${INPUT_AB_ARMS-A,B}"
          if [ "${INPUT_SUITE}" = ab-v2 ]; then
            case "${ab_arms}" in
              A,B) ;;
              A)
                export LIVE_AB_REPS=1
                need=17
                ;;
              *)
                echo "::error::unknown ab_arms input (A,B or A)"
                exit 1
                ;;
            esac
            export LIVE_AB_SET=v2 LIVE_AB_ARMS="${ab_arms}"
          elif [ "${ab_arms}" != A,B ]; then
            echo "::error::ab_arms is only for the ab-v2 suite"
            exit 1
          fi
          if [ "${INPUT_SUITE}" = oss-ab ] || [ "${INPUT_SUITE}" = evolve-p ]; then
            # one library a dispatch: the whole plan needs more than the ceiling
            if ! [[ "${INPUT_OSS_REPO}" =~ ^[a-z][a-z0-9_]{0,39}$ ]]; then
              echo "::error::${INPUT_SUITE} needs oss_repo, one OSS library name (lower case)"
              exit 1
            fi
            if [ "${INPUT_SUITE}" = oss-ab ]; then
              export LIVE_OSS_AB_REPOS="${INPUT_OSS_REPO}"
            else
              # E4 (V8): arm P beside blind on the library, up to 6 rounds each
              export LIVE_EVOLVE_REPOS="${INPUT_OSS_REPO}" LIVE_EVOLVE_ARMS=blind,P LIVE_EVOLVE_ROUNDS=6
            fi
          elif [ -n "${INPUT_OSS_REPO}" ]; then
            echo "::error::oss_repo is only for the oss-ab and evolve-p suites"
            exit 1
          fi
          if [ "${INPUT_SUITE}" = upstream ] || [ "${INPUT_SUITE}" = upstream-verify ]; then
            # ten candidates a dispatch; the packages some need beyond their
            # checkout: exact versions, wheels only, hash-pinned, no deps
            case "${INPUT_UPSTREAM_BATCH}" in
              1 | 2 | 3) export LIVE_UPSTREAM_BATCH="${INPUT_UPSTREAM_BATCH}" ;;
              *)
                echo "::error::upstream_batch must be 1, 2 or 3"
                exit 1
                ;;
            esac
            if [ "${INPUT_SUITE}" = upstream ] && [ "${INPUT_MODE}" != wired ]; then
              echo "::error::the upstream suite runs wired only (mode wired)"
              exit 1
            fi
            uv pip install --no-deps --require-hashes --only-binary :all: -r tests/fixtures/upstream_corpus/requirements.txt
          fi
          case "${INPUT_MODE}" in
            aimed) ;;
            blind) ;;
            decoy) ;;
            wired) ;;
            *)
              echo "::error::unknown mode input (aimed, blind, decoy or wired)"
              exit 1
              ;;
          esac
          case "${INPUT_ENGINE_MODEL}" in
            claude-opus-5-5) ;;
            claude-sonnet-5-5) export ENGINE_FALLBACKS=false ;;
            *)
              echo "::error::unknown engine_model input"
              exit 1
              ;;
          esac
          case "${INPUT_EDITOR_MODEL}" in
            default) ;;
            claude-sonnet-5-5) export EDITOR_MODEL=claude-sonnet-5-5 EDITOR_EFFORT=low ;;
            *)
              echo "::error::unknown editor_model input (default or claude-sonnet-5-5)"
              exit 1
              ;;
          esac
          # The noise rule of every suite, never a default (D41): step3 measures
          # the Step 3 defaults (paired trials, confirmation, 3 calibration
          # blocks) on L0-L2; step2 keeps Step 2's measurement for the other
          # suites (their timeouts and Window 0 comparisons; an A/A floor of a
          # millisecond workload can pass 100 % and stop the run).
          case "${INPUT_SUITE}" in
            noise | corpus | hard | oss | upstream-verify | upstream | ideas-slice | ideas-picks | ideas-x2 | combine-replay | combine-order) noise_rule=step3 ;;
            stage-a | attack | probes | triage | papers | web | prescreen) noise_rule=step2 ;;
            sweep | sweep-fable | sweep-record | ab | ab-v2-p | ab-v2 | escalation | acquire) noise_rule=step2 ;;
            heal | oss-ab | evolve | evolve-more | evolve-p | heal-hard | build | grader | agent-probes | heal-agent | research-agent) noise_rule=step2 ;;
            watch | watch-cleanup | ideas-probe | ideas-views | ideas-marker | ideas-validate | ideas-pool | ideas-reaudit) noise_rule=step2 ;;
            *)
              echo "::error::no noise rule for suite ${INPUT_SUITE}"
              exit 1
              ;;
          esac
          if [ "${noise_rule}" = step3 ]; then
            export PAIRED_TRIALS=true CONFIRM_WINNERS=true NOISE_CALIBRATION_BLOCKS=3
          else
            export PAIRED_TRIALS=false CONFIRM_WINNERS=false NOISE_CALIBRATION_BLOCKS=0
          fi
          if [ "${INPUT_SUITE}" = noise ]; then
            # L0: A/A blocks through the engine's paired path, 10 a repository
            export LIVE_NOISE_PATH=paired
          fi
          if ! [[ "${INPUT_SUITE_CAP_USD}" =~ ^[0-9]{1,3}([.][0-9]{1,2})?$ ]] ||
            ! awk -v cap="${INPUT_SUITE_CAP_USD}" 'BEGIN { exit !(cap > 0 && cap <= 150) }'; then
            echo "::error::suite_cap_usd must be a number of USD above 0 and at most 150"
            exit 1
          fi
          if ! awk -v cap="${INPUT_SUITE_CAP_USD}" -v need="${need}" 'BEGIN { exit !(cap >= need) }'; then
            echo "::error::suite_cap_usd ${INPUT_SUITE_CAP_USD} is below the ${need} USD suite ${INPUT_SUITE} needs to admit every test"
            exit 1
          fi
          export ENGINE_MODEL="${INPUT_ENGINE_MODEL}"
          export LIVE_SUITE_CAP_USD="${INPUT_SUITE_CAP_USD}"
          export LIVE_CORPUS_MODE="${INPUT_MODE}"
          # X2-zerocase: tests/live/conftest.py fails the session when no live
          # case passed or failed in its body (all skipped or deselected), so a
          # dispatch that runs nothing is red, not green with 0 USD spent
          export LIVE_REQUIRE_CASES="${INPUT_SUITE}"
          : > "${LIVE_RESULTS_PATH}"
          echo "suite ${INPUT_SUITE}, mode ${LIVE_CORPUS_MODE}, ENGINE_MODEL ${ENGINE_MODEL}, EDITOR_MODEL ${EDITOR_MODEL:-default}, noise rule ${noise_rule}, LIVE_SUITE_CAP_USD ${LIVE_SUITE_CAP_USD}, idea pipeline ${INPUT_IDEA_PIPELINE-off}, portfolio rounds ${portfolio_rounds}, corpus select ${INPUT_CORPUS_SELECT-all}, ab arms ${ab_arms}"
          uv run pytest "${paths[@]}" -m live --no-cov -n 0 -rA

      # One JSON line per corpus run (CorpusOutcome), kept for the STATUS
      # ledger and the stage M comparison across runs; ideas-x2 also writes
      # each kept diff and the delivered patch to live-patches/ beside it
      # (x2_patches.PATCH_DIR, U-patch), the artifact rooted at runner.temp.
      # The artifact names the window whose key paid (U-key): W1 or W2.
      - name: Upload live corpus results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-results-${{ inputs.key_slot == '2' && 'W2' || 'W1' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/live-results.jsonl
            ${{ runner.temp }}/live-patches/
          if-no-files-found: ignore
          retention-days: 30

  # Database schema: apply every migration to a real Postgres, then re-apply the
  # engine migrations (003 onward) to prove they are idempotent. 001 and 002 are
  # not idempotent (plain CREATE TABLE packages, CREATE INDEX idx_packages_name),
  # so they run once. Same pinned image as the python job's service.
  schema-apply:
    name: Schema Apply (Postgres)
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.infrastructure == 'true' ||
      needs.detect-changes.outputs.workflows == 'true' ||
      github.event_name == 'push'
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_DB: ai_platform
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: devpass
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U dev -d ai_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure psql is available
        run: which psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      # Same order as docker-entrypoint-initdb.d on a fresh volume (file name
      # order); every file runs exactly once here.
      - name: Apply migrations once in order (001 onward)
        run: |
          for file in infrastructure/schema/*.sql; do
            echo "::group::${file}"
            PGPASSWORD=devpass psql -h localhost -U dev -d ai_platform -v ON_ERROR_STOP=1 -f "${file}"
            echo "::endgroup::"
          done

      - name: Re-apply 003 onward and diff the catalog (idempotence proof)
        run: |
          snapshot() {
            {
              PGPASSWORD=devpass psql -h localhost -U dev -d ai_platform -v ON_ERROR_STOP=1 -tAc "SELECT conrelid::regclass, conname, pg_get_constraintdef(oid) FROM pg_constraint WHERE connamespace = 'public'::regnamespace ORDER BY 1, 2"
              PGPASSWORD=devpass psql -h localhost -U dev -d ai_platform -v ON_ERROR_STOP=1 -tAc "SELECT tablename, indexname, indexdef FROM pg_indexes WHERE schemaname = 'public' ORDER BY 1, 2"
              PGPASSWORD=devpass psql -h localhost -U dev -d ai_platform -v ON_ERROR_STOP=1 -tAc "SELECT table_name, column_name, data_type, is_nullable, column_default, is_identity FROM information_schema.columns WHERE table_schema = 'public' ORDER BY 1, 2"
            } > "$1"
          }
          snapshot "${RUNNER_TEMP}/schema-before.txt"
          # Every engine migration from 003 on, in file-name order, so a new
          # migration is covered without a workflow edit (Step 3, D25).
          for file in infrastructure/schema/*.sql; do
            case "$(basename "${file}")" in
              00[12]_*) continue ;;
            esac
            echo "::group::re-apply ${file}"
            PGPASSWORD=devpass psql -h localhost -U dev -d ai_platform -v ON_ERROR_STOP=1 -f "${file}"
            echo "::endgroup::"
          done
          snapshot "${RUNNER_TEMP}/schema-after.txt"
          echo "catalog: $(wc -l < "${RUNNER_TEMP}/schema-before.txt") lines"
          diff -u "${RUNNER_TEMP}/schema-before.txt" "${RUNNER_TEMP}/schema-after.txt"

      - name: Verify engine tables and columns
        run: |
          query() {
            PGPASSWORD=devpass psql -h localhost -U dev -d ai_platform -v ON_ERROR_STOP=1 -tAc "$1"
          }
          status=0
          for table in projects workloads objectives guardrails techniques hotspots hypotheses lessons; do
            if [ "$(query "SELECT to_regclass('public.${table}') IS NOT NULL")" = "t" ]; then
              echo "table ${table}: present"
            else
              echo "::error::table ${table} is missing"
              status=1
            fi
          done
          # table.column:data_type (003 research columns, the 004 additions,
          # then 005's caller-id columns)
          for spec in research_papers.claims:jsonb research_papers.citation_count:integer \
            projects.test_command:jsonb lessons.seq:bigint \
            lessons.gain:'double precision' lessons.weight:'double precision' \
            lessons.hypothesis_id:'character varying' lessons.technique_id:'character varying'; do
            target="${spec%%:*}"
            want="${spec#*:}"
            got="$(query "SELECT data_type FROM information_schema.columns WHERE table_schema = 'public' AND table_name = '${target%%.*}' AND column_name = '${target#*.}'")"
            if [ "${got}" = "${want}" ]; then
              echo "column ${target} (${want}): present"
            else
              echo "::error::column ${target} should be ${want}, found '${got}'"
              status=1
            fi
          done
          for index in uq_task_thread uq_lessons_seq; do
            if [ "$(query "SELECT to_regclass('public.${index}') IS NOT NULL")" = "t" ]; then
              echo "index ${index}: present"
            else
              echo "::error::index ${index} is missing"
              status=1
            fi
          done
          if [ "$(query "SELECT count(*) FROM pg_constraint WHERE conname = 'chk_project_test_command_argv' AND conrelid = 'public.projects'::regclass")" = "1" ]; then
            echo "constraint chk_project_test_command_argv: present once"
          else
            echo "::error::constraint chk_project_test_command_argv is missing or duplicated"
            status=1
          fi
          # 005: the caller-id columns are 64 wide, each with its id-rule CHECK
          for column in hypothesis_id technique_id; do
            width="$(query "SELECT character_maximum_length FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'lessons' AND column_name = '${column}'")"
            if [ "${width}" = "64" ]; then
              echo "column lessons.${column}: VARCHAR(64)"
            else
              echo "::error::column lessons.${column} should be VARCHAR(64), found width '${width}'"
              status=1
            fi
            if [ "$(query "SELECT count(*) FROM pg_constraint WHERE conname = 'chk_lesson_${column}' AND conrelid = 'public.lessons'::regclass")" = "1" ]; then
              echo "constraint chk_lesson_${column}: present once"
            else
              echo "::error::constraint chk_lesson_${column} is missing or duplicated"
              status=1
            fi
          done
          # 006: a lesson may record the review outcome (D35)
          if [ "$(query "SELECT count(*) FROM pg_constraint WHERE conname = 'chk_lesson_outcome' AND conrelid = 'public.lessons'::regclass AND pg_get_constraintdef(oid) LIKE '%''review''%'")" = "1" ]; then
            echo "constraint chk_lesson_outcome: allows review"
          else
            echo "::error::constraint chk_lesson_outcome does not allow review (006)"
            status=1
          fi
          exit "${status}"

  # Database init exactly as a developer runs it: docker compose starts the
  # postgres service on an empty volume, the image's entrypoint applies every
  # file mounted at /docker-entrypoint-initdb.d, and the result must be a
  # healthy database with the 14 engine tables and no error in the init log.
  compose-init:
    name: Compose Init (Postgres)
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.infrastructure == 'true' ||
      needs.detect-changes.outputs.workflows == 'true' ||
      github.event_name == 'push'
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      COMPOSE_FILE: docker-compose.dev.yml

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start postgres on an empty volume
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up -d postgres

      - name: Wait for the healthcheck
        run: |
          container="$(docker compose ps -q postgres)"
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "${container}")"
            if [ "${status}" = "healthy" ]; then
              echo "postgres is healthy"
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Status}}' "${container}")" != "running" ]; then
              echo "::error::postgres container stopped during init"
              docker compose logs postgres
              exit 1
            fi
            sleep 2
          done
          echo "::error::postgres did not become healthy in 120 s"
          docker compose logs postgres
          exit 1

      # A client connecting while the server boots or restarts after the init
      # scripts (the health check, a racing probe) logs "FATAL: the database
      # system is starting up" (or "shutting down"); that is a refused
      # connection, not an init error, so only those exact lines are dropped.
      - name: Init log has no errors
        run: |
          docker compose logs postgres > /tmp/postgres-init.log
          if grep -vE 'FATAL:  the database system is (starting up|shutting down)$' /tmp/postgres-init.log |
            grep -iE '(^|[^a-z])(error|fatal)([^a-z]|$)'; then
            echo "::error::postgres init log contains errors (see above)"
            exit 1
          fi
          echo "init log is clean ($(wc -l < /tmp/postgres-init.log) lines)"

      - name: Database has the 14 engine tables
        run: |
          count="$(docker compose exec -T postgres psql -U dev -d ai_platform -tAc \
            "select count(*) from pg_tables where schemaname = 'public'")"
          echo "public tables: ${count}"
          docker compose exec -T postgres psql -U dev -d ai_platform -c '\dt'
          if [ "${count}" != "14" ]; then
            echo "::error::expected 14 tables after 001 -> 006 (004 to 006 add none), found ${count}"
            exit 1
          fi

      - name: Tear down (volume included)
        if: always()
        run: docker compose down -v --remove-orphans

  # Dependency security scan (optimized)
  security:
    name: Security Scan
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.typescript == 'true' ||
      needs.detect-changes.outputs.workflows == 'true' ||
      github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.20.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Blocking: the stage gate already requires a clean audit at moderate+,
      # and a non-blocking audit never stopped a vulnerable lockfile.
      - name: Run pnpm audit
        run: pnpm audit --audit-level=high

  # Docker security scan (optimized with Trivy caching)
  docker-security:
    name: Docker Security Scan
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch'
    # No security-events: results go to an artifact, not SARIF upload.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cache Trivy database for 40-50% speedup
      - name: Cache Trivy Database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      # Consolidated single scan (70% faster than 3 separate scans)
      - name: Run Trivy - All Severities
        # Commit of the signed v0.36.0 tag (on master; its nested actions are
        # SHA-pinned). A mutable branch ref would run unreviewed code here.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          exit-code: '0'

      # Process results and generate reports
      - name: Process Trivy Results
        if: always()
        run: |
          # Extract HIGH/CRITICAL issues
          if [ -f trivy-results.json ]; then
            jq '.Results[] | select(.Misconfigurations != null) | .Misconfigurations[] | select(.Severity == "CRITICAL" or .Severity == "HIGH")' trivy-results.json > high-critical.json || echo "[]" > high-critical.json

            # Extract MEDIUM/LOW issues
            jq '.Results[] | select(.Misconfigurations != null) | .Misconfigurations[] | select(.Severity == "MEDIUM" or .Severity == "LOW")' trivy-results.json > medium-low.json || echo "[]" > medium-low.json

            # Count issues
            HIGH_CRITICAL_COUNT=$(jq -s 'length' high-critical.json)
            MEDIUM_LOW_COUNT=$(jq -s 'length' medium-low.json)

            {
              echo "HIGH_CRITICAL_COUNT=$HIGH_CRITICAL_COUNT"
              echo "MEDIUM_LOW_COUNT=$MEDIUM_LOW_COUNT"
            } >> "$GITHUB_ENV"
          fi

      # Upload optimized artifacts
      - name: Upload Trivy Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-security-scan-${{ github.run_number }}
          path: |
            trivy-results.json
            high-critical.json
            medium-low.json
          retention-days: 14
          compression-level: 6

      # Enhanced security summary. github.* values reach the script through
      # env, never through ${{ }} inside run: (no script injection).
      - name: Generate Security Summary
        if: always()
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "# 🔒 Trivy Security Scan Report"
            echo ""

            # Status badge
            if [ "${HIGH_CRITICAL_COUNT:-0}" -gt 0 ]; then
              echo "![Status](https://img.shields.io/badge/Security-FAILED-red?style=for-the-badge&logo=security)"
            elif [ "${MEDIUM_LOW_COUNT:-0}" -gt 0 ]; then
              echo "![Status](https://img.shields.io/badge/Security-WARNING-yellow?style=for-the-badge&logo=security)"
            else
              echo "![Status](https://img.shields.io/badge/Security-PASSED-brightgreen?style=for-the-badge&logo=security)"
            fi

            echo ""
            echo "| Severity | Count |"
            echo "|----------|-------|"
            echo "| 🔴 CRITICAL/HIGH | ${HIGH_CRITICAL_COUNT:-0} |"
            echo "| 🟡 MEDIUM/LOW | ${MEDIUM_LOW_COUNT:-0} |"
            echo ""
            echo "📅 **Scan Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "📦 **Repository:** \`${REPOSITORY}\`"
            echo "🌿 **Branch:** \`${REF_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # FAIL if CRITICAL/HIGH found
      - name: Check for HIGH/CRITICAL Vulnerabilities
        if: always()
        run: |
          if [ "${HIGH_CRITICAL_COUNT:-0}" -gt 0 ]; then
            echo "❌ Found ${HIGH_CRITICAL_COUNT} CRITICAL/HIGH severity issues!"
            echo "Please review the security scan results above."
            exit 1
          else
            echo "✅ No CRITICAL/HIGH severity vulnerabilities found."
          fi
