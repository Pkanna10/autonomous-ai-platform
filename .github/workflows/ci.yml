name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  # TypeScript/Node.js CI
  typescript:
    name: TypeScript CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Run tests
        run: pnpm test

      - name: Check coverage threshold
        run: pnpm test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ./coverage
          retention-days: 30

  # Python CI
  python:
    name: Python CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/python_agents

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup uv (fast Python package installer)
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: '**/requirements.txt'

      - name: Install dependencies with uv
        run: |
          uv pip install --system ruff black mypy pytest pytest-cov

      - name: Lint with Ruff
        run: ruff check .

      - name: Format check with Black
        run: black --check .

      - name: Type check with Mypy
        run: |
          if find . -name "*.py" -type f | grep -q .; then
            mypy .
          else
            echo "No Python files found, skipping mypy"
          fi
        continue-on-error: true # Don't fail yet since Python code is early stage

      - name: Run tests
        run: pytest --cov --cov-report=xml --cov-report=term
        if: hashFiles('services/python_agents/tests/**/*.py') != ''

  # Dependency security scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true # Don't fail CI on vulnerabilities yet

  # Docker security scan
  docker-security:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Scan for MEDIUM/LOW (warning only, don't fail)
      - name: Run Trivy - MEDIUM/LOW Severity
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-medium-low.txt'
          severity: 'MEDIUM,LOW'
          exit-code: '0'

      # Scan for HIGH/CRITICAL (will fail the build)
      - name: Run Trivy - HIGH/CRITICAL Severity
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-high-critical.txt'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # Generate JSON for artifacts
      - name: Run Trivy - JSON Report
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          exit-code: '0'

      # Upload artifacts
      - name: Upload Trivy Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-security-scan-${{ github.run_number }}
          path: |
            trivy-high-critical.txt
            trivy-medium-low.txt
            trivy-results.json
          retention-days: 30

      # Generate enhanced security summary
      - name: Generate Enhanced Security Summary
        if: always()
        run: |
          echo "# 🔒 Trivy Security Scan Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Determine overall status
          CRITICAL_HIGH_FOUND=false
          MEDIUM_LOW_FOUND=false

          if [ -f trivy-high-critical.txt ] && grep -q "Total: [1-9]" trivy-high-critical.txt 2>/dev/null; then
            CRITICAL_HIGH_FOUND=true
          fi

          if [ -f trivy-medium-low.txt ] && grep -q "Total: [1-9]" trivy-medium-low.txt 2>/dev/null; then
            MEDIUM_LOW_FOUND=true
          fi

          # Status badges
          if [ "$CRITICAL_HIGH_FOUND" = true ]; then
            echo "![Status](https://img.shields.io/badge/Security-FAILED-red?style=for-the-badge&logo=security)" >> $GITHUB_STEP_SUMMARY
          elif [ "$MEDIUM_LOW_FOUND" = true ]; then
            echo "![Status](https://img.shields.io/badge/Security-WARNING-yellow?style=for-the-badge&logo=security)" >> $GITHUB_STEP_SUMMARY
          else
            echo "![Status](https://img.shields.io/badge/Security-PASSED-brightgreen?style=for-the-badge&logo=security)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📅 Scan Date | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Repository | \`${{ github.repository }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌿 Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 📝 Commit | \`${GITHUB_SHA:0:7}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 👤 Author | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check for HIGH/CRITICAL vulnerabilities
          if [ -f trivy-high-critical.txt ]; then
            if grep -q "Total: [1-9]" trivy-high-critical.txt 2>/dev/null; then
              echo "## 🚨 CRITICAL/HIGH Severity Issues Found" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "<details>" >> $GITHUB_STEP_SUMMARY
              echo "<summary>⚠️ Click to view HIGH/CRITICAL vulnerabilities</summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              cat trivy-high-critical.txt >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            else
              echo "## ✅ No HIGH/CRITICAL Issues Found" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          # Check for MEDIUM/LOW vulnerabilities
          if [ -f trivy-medium-low.txt ]; then
            if grep -q "Total: [1-9]" trivy-medium-low.txt 2>/dev/null; then
              echo "## ⚡ MEDIUM/LOW Severity Issues (Informational)" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "<details>" >> $GITHUB_STEP_SUMMARY
              echo "<summary>ℹ️ Click to view MEDIUM/LOW vulnerabilities</summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              cat trivy-medium-low.txt >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            else
              echo "## ✅ No MEDIUM/LOW Issues Found" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "📦 **[Download detailed reports from Artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})**" >> $GITHUB_STEP_SUMMARY

      # FAIL the build if HIGH/CRITICAL vulnerabilities found
      - name: Check for HIGH/CRITICAL Vulnerabilities
        if: always()
        run: |
          if [ -f trivy-high-critical.txt ]; then
            if grep -q "Total: [1-9]" trivy-high-critical.txt; then
              echo "❌ CRITICAL or HIGH severity vulnerabilities found!"
              echo "Please review the security scan results above."
              exit 1
            else
              echo "✅ No CRITICAL or HIGH severity vulnerabilities found."
            fi
          fi
