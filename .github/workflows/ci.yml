              echo "::error::unknown corpus_select input (all or controls)"
              exit 1
              ;;
          esac
          # The ideas-probe arms (V7): E1 by default, E0b's count mode, E1b's
          # lane efforts on E1's recorded facts (committed by the Lead at
          # tests/fixtures/ideas_probe/facts.jsonl; refused before any spend
          # while missing), X1's configurations (Vd) on those facts and
          # Va's recorded views (committed at
          # tests/fixtures/ideas_probe/views.jsonl from the ideas-views run;
          # refused before any spend while missing or recorded from another
          # source), or X1-1, O42's re-run of X1-1 beside arm A and the
          # auditor on the same facts and views (run 1's four libraries
          # unless named). An unset input reads as the default. ideas_repos
          # names the libraries (E1 must: four fit the job's minutes, and the
          # module fixture refuses E1's whole eight before any spend); the
          # need is their count x the plan's library cap in cents, rounded up.
          ideas_arms="${INPUT_IDEAS_ARMS-A,B,C,D,E}"
          ideas_repos="${INPUT_IDEAS_REPOS-}"
          if [ "${INPUT_SUITE}" = ideas-probe ]; then
            case "${ideas_arms}" in
              A,B,C,D,E) cents=1410 ;;
              count) cents=85; need=9 ;;
              C-low,C-high)
                cents=495
                need=20
                export LIVE_IDEAS_FACTS=tests/fixtures/ideas_probe/facts.jsonl
                ;;
              X1 | X1-1)
                if [ "${ideas_arms}" = X1 ]; then cents=1695; need=51; else cents=820; need=33; fi
                export LIVE_IDEAS_FACTS=tests/fixtures/ideas_probe/facts.jsonl
                export LIVE_IDEAS_VIEWS=tests/fixtures/ideas_probe/views.jsonl
                ;;
              *)
                echo "::error::unknown ideas_arms input (A,B,C,D,E, count, C-low,C-high, X1 or X1-1)"
                exit 1
                ;;
            esac
            if [ -n "${ideas_repos}" ]; then
              if ! [[ "${ideas_repos}" =~ ^[a-z][a-z0-9_]{0,39}(,[a-z][a-z0-9_]{0,39}){0,19}$ ]]; then
                echo "::error::ideas_repos must be comma-separated OSS library names (lower case)"
                exit 1
              fi
              commas="${ideas_repos//[^,]/}"
              need=$(( ((${#commas} + 1) * cents + 99) / 100 ))
              export LIVE_IDEAS_REPOS="${ideas_repos}"
            fi
            export LIVE_IDEAS_ARMS="${ideas_arms}"
          elif [ "${ideas_arms}" != A,B,C,D,E ]; then
            echo "::error::ideas_arms is only for the ideas-probe suite"
            exit 1
          elif [ -n "${ideas_repos}" ]; then
            echo "::error::ideas_repos is only for the ideas-probe suite"
            exit 1
          fi
          # The execution slice (Ve): X1's results (both X1 dispatches) and
          # Vb's (the marker's verdict), committed by the Lead at
          # tests/fixtures/ideas_slice/ (refused before any spend while
          # missing), with the operation-count judge on (spec 6.5) and the
          # Step 3 noise rule (normal engine trials). slice_repos names the
          # dispatch's one or two libraries; the need is their count x 37.45
          # (ideas_slice.SlicePlan.library_cap, O41's tournament included),
          # rounded up to the dollar. The pooled ranking (V-O40) reads the same
          # X1 and marker results for the four libraries outside the slice.
          slice_repos="${INPUT_SLICE_REPOS-}"
          if [ "${INPUT_SUITE}" = ideas-slice ]; then
            if ! [[ "${slice_repos}" =~ ^[a-z][a-z0-9_]{0,39}(,[a-z][a-z0-9_]{0,39})?$ ]]; then
              echo "::error::ideas-slice needs slice_repos, one or two OSS library names (lower case, comma-separated)"
              exit 1
            fi
            commas="${slice_repos//[^,]/}"
            need=$(( ((${#commas} + 1) * 3745 + 99) / 100 ))
            export LIVE_SLICE_REPOS="${slice_repos}" OP_COUNT_JUDGE=true
            export LIVE_SLICE_IDEAS=tests/fixtures/ideas_slice/x1-1.jsonl,tests/fixtures/ideas_slice/x1-2.jsonl
            export LIVE_SLICE_MARKER=tests/fixtures/ideas_slice/marker.jsonl
          elif [ -n "${slice_repos}" ]; then
            echo "::error::slice_repos is only for the ideas-slice suite"
            exit 1
          fi
          # The reader dispatch (V-picks, O48): the blind reader's would-try
          # ideas as ordinary engine trials, resolved in the module fixture
          # from committed files (the sample key, the slice's inputs), with
          # the operation-count judge on and the Step 3 noise rule.
          if [ "${INPUT_SUITE}" = ideas-picks ]; then
            export OP_COUNT_JUDGE=true
          fi
          # The combine re-measure replay (O62 item 5): the X2 arms'
          # measurement settings, the Step 3 noise rule below and the
          # op-count judge on (combine_replay.REPLAY_SETTINGS, checked before
          # any clone); the archived tips are fixed in combine_replay.CASES.
          if [ "${INPUT_SUITE}" = combine-replay ]; then
            export OP_COUNT_JUDGE=true
          fi
          # The combine-order replay (O65 item 2): the same measurement
          # settings, and order_batch's libraries (an unset input, an older
          # caller, reads as 1; an empty one is refused); the cases are fixed
          # in order_cases.RUNS.
          if [ "${INPUT_SUITE}" = combine-order ]; then
            case "${INPUT_ORDER_BATCH-1}" in
              1 | 2 | 3) export LIVE_ORDER_BATCH="${INPUT_ORDER_BATCH-1}" ;;
              *)
                echo "::error::order_batch must be 1, 2 or 3"
                exit 1
                ;;
            esac
            export OP_COUNT_JUDGE=true
          fi
          if [ "${INPUT_SUITE}" = ideas-pool ]; then
            export LIVE_POOL_IDEAS=tests/fixtures/ideas_slice/x1-1.jsonl,tests/fixtures/ideas_slice/x1-2.jsonl
            export LIVE_POOL_MARKER=tests/fixtures/ideas_slice/marker.jsonl
          fi
          # The pooled re-audit (V-reaudit, O44): X1 run 1's results, archived
          # in the handoff folder, and the X1-1 re-run's, committed by the Lead
          # at tests/fixtures/ideas_reaudit/ (refused before any spend while
          # missing); fixed paths, never a dispatch input.
          if [ "${INPUT_SUITE}" = ideas-reaudit ]; then
            export LIVE_REAUDIT_RUN1=../../.claude/handoff/step3/idea-lab/x1/ideas-probe-x1-run1-41679255224.jsonl
            export LIVE_REAUDIT_RERUN=tests/fixtures/ideas_reaudit/x1-1-rerun.jsonl
          fi
          # X2a (spec-idea-lab 9, O48): x2_dispatch names one dispatch's arm
          # and libraries, ARM:lib,lib (ideas_x2.x2_plan refuses a library off
          # the arm's, the twin's four included). oss.start_oss_loop reads the
          # process-wide settings, so each arm is the env mapping exported
          # here, ideas_x2.arm_env exactly (test_corpus_guards.py checks every
          # value and that it builds the arm's Settings): two rounds in all
          # (PORTFOLIO_ROUNDS 2: the router ends exploration at a keep once
          # the round reaches it; MAX_TRIAL_ROUNDS 2), round seeds, near-miss
          # compounds, the op-count judge, the eliminate lens on Haiku 5.5,
          # X2-V's views X1-3's map; X2-D three rounds (PORTFOLIO_ROUNDS and
          # MAX_TRIAL_ROUNDS 3) and a third generator call (GENERATOR_MAX_CALLS
          # 3, every other arm the default 2), run_cap 12.90; X2-L (O61) X2-0's
          # requests with the leap on Fable 5.2 (ALLOW_RETENTION_MODELS, D63,
          # as X2-F), run_cap 21.10. Normal engine runs, so the
          # Step 3 noise rule; the need is the libraries x ideas_x2.run_cap,
          # rounded up.
          x2_dispatch="${INPUT_X2_DISPATCH-}"
          if [ "${INPUT_SUITE}" = ideas-x2 ]; then
            x2_cents=935
            x2_views='{}'
            x2_count=off
            x2_stacks=off
            x2_shadow=off
            x2_rounds=2
            x2_gen_calls=2
            x2_portfolio=false
            x2_leap=claude-opus-5-5
            case "${x2_dispatch%%:*}" in
              X2-0 | "X2-0'") ;;
              X2-C) x2_count=record ;;
              X2-S) x2_count=record x2_stacks=on ;;
              X2-SV) x2_count=record x2_shadow=record ;;
              X2-D) x2_rounds=3 x2_gen_calls=3 x2_cents=1290 ;;
              X2-P) x2_portfolio=true x2_cents=1055 ;;  # U-portfolio: the portfolio leap on Opus 5.5
              X2-F) x2_portfolio=true x2_leap=claude-fable-5-2 x2_cents=2110 ;;  # the same on Fable 5.2
              X2-L) x2_leap=claude-fable-5-2 x2_cents=2110 ;;  # O61: X2-0 with the leap on Fable 5.2
              X2-V)
                x2_cents=945
                x2_views='{"eliminate":"callers","assume_less":"input_shape","name_the_problem":"data_structures","recombine":"whole_module","resolve_tradeoff":"next_hotspots","far":"history"}'
                ;;
              *)
                echo "::error::ideas-x2 needs x2_dispatch, an arm (X2-0, X2-0', X2-V, X2-C, X2-S, X2-SV, X2-D, X2-P, X2-F or X2-L), ':' and its libraries"
                exit 1
                ;;
            esac
            x2_repos="${x2_dispatch#*:}"
            if [[ "${x2_dispatch}" != *:* ]] || ! [[ "${x2_repos}" =~ ^[a-z][a-z0-9_]{0,39}(,[a-z][a-z0-9_]{0,39}){0,7}$ ]]; then
              echo "::error::ideas-x2 needs x2_dispatch, an arm (X2-0, X2-0', X2-V, X2-C, X2-S, X2-SV, X2-D, X2-P, X2-F or X2-L), ':' and its libraries"
              exit 1
            fi
            x2_replicate="${INPUT_X2_REPLICATE-}"
            if [ "${x2_portfolio}" = true ] && ! [[ "${x2_replicate}" =~ ^[1-3]$ ]]; then
              echo "::error::ideas-x2 X2-P and X2-F need x2_replicate, 1, 2 or 3"
              exit 1
            fi
            commas="${x2_repos//[^,]/}"
            need=$(( ((${#commas} + 1) * x2_cents + 99) / 100 ))
            export LIVE_X2_DISPATCH="${x2_dispatch}" IDEA_PIPELINE=true PORTFOLIO_ROUNDS="${x2_rounds}" MAX_TRIAL_ROUNDS="${x2_rounds}"
            export GENERATOR_MAX_CALLS="${x2_gen_calls}"  # X2-D's third call, else the default 2
            export IDEAS_ROUND_SEEDS=true NEAR_MISS_COMPOUNDS=true OP_COUNT_JUDGE=true
            export GENERATOR_LESSONS=false IDEAS_SEQUENTIAL_LANES=false IDEAS_MECHANISM_DEDUPE=false
            export IDEAS_RELAX_LANES='[]' IDEAS_THINK_LINE_ALL=false IDEAS_LANE_FRAMEWORKS=false
            export IDEAS_LENSES='["eliminate","assume_less","name_the_problem","recombine","resolve_tradeoff","far"]'
            export IDEAS_LANE_MODEL=claude-sonnet-5-5 IDEAS_LANE_MODELS='{"eliminate":"claude-haiku-5-5"}'
            export IDEAS_LEAP_MODEL="${x2_leap}" IDEAS_REVIEWER_MODEL=claude-opus-5-5
            export IDEAS_LANE_VIEWS="${x2_views}" IDEAS_COUNT_CONTRACT="${x2_count}" SITE_STACKS="${x2_stacks}"
            export IDEAS_VIEW_RECORD=true  # emergence round 2, S1: every arm's view_sha rows
            export SHADOW_VERIFY="${x2_shadow}"  # emergence round 2, S4: X2-SV's capture rows
            if [ "${x2_portfolio}" = true ]; then  # U-portfolio: the deal's run; the library is per case
              export IDEAS_LEAP_PORTFOLIO=true IDEAS_LEAP_DEAL_RUN="${x2_replicate}"
            fi
            if [ "${x2_leap}" = claude-fable-5-2 ]; then  # D63: Fable 5.2 needs 30-day retention
              export ALLOW_RETENTION_MODELS=true
            fi
          elif [ -n "${x2_dispatch}" ]; then
            echo "::error::x2_dispatch is only for the ideas-x2 suite"
            exit 1
          fi
          if [ "${INPUT_SUITE}" = sweep-fable ]; then
            # Fable 5.1 (the research plan's optional arm) beside the one arm
