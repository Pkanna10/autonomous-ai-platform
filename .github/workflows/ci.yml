name: CI

on:
  pull_request:
  push:
    branches: [master, main]
  # Manual runs execute only the live Claude smoke test (job live-smoke); every
  # other job is skipped for this event. The inputs choose what live-smoke runs
  # (STATUS Window 0: stage-a, the benchmark corpus E0, the attack corpus X,
  # the hard corpus, the open-source repositories), what each corpus run is
  # handed (mode), the editor model (stage M) and the suite's hard cap. There
  # is no "every suite" choice: together they need more (196 USD) than the
  # 150 USD ceiling of suite_cap_usd, so they are dispatched one by one.
  workflow_dispatch:
    inputs:
      suite:
        description: 'Live suite: stage-a, corpus, attack, hard, oss, or an experiment (probes, triage, papers, web, prescreen, sweep, sweep-fable, sweep-record, ab, ab-v2-p, ab-v2, escalation, acquire, noise, heal, oss-ab, evolve, evolve-more, evolve-p, heal-hard, build, grader, upstream-verify, upstream, agent-probes, heal-agent, research-agent, watch, watch-cleanup, ideas-probe, ideas-views, ideas-marker, ideas-validate, ideas-slice, ideas-pool, ideas-reaudit, ideas-picks, ideas-x2, combine-replay, combine-order) (one at a time: together they need more than the 150 USD ceiling)'
        type: choice
        options:
          [
            stage-a,
            corpus,
            attack,
            hard,
            oss,
            probes,
            triage,
            papers,
            web,
            prescreen,
            sweep,
            sweep-fable,
            sweep-record,
            ab,
            ab-v2-p,
            ab-v2,
            escalation,
            acquire,
            noise,
            heal,
            oss-ab,
            evolve,
            evolve-more,
            evolve-p,
            heal-hard,
            build,
            grader,
            upstream-verify,
            upstream,
            agent-probes,
            heal-agent,
            research-agent,
            watch,
            watch-cleanup,
            ideas-probe,
            ideas-views,
            ideas-marker,
            ideas-validate,
            ideas-slice,
            ideas-pool,
            ideas-reaudit,
            ideas-picks,
            ideas-x2,
            combine-replay,
            combine-order,
          ]
        default: stage-a
      mode:
        description: 'Corpus mode (LIVE_CORPUS_MODE): aimed (both manifest hypotheses), blind (one generic hypothesis), decoy (the neutral one alone), wired (none: the engine generates them)'
        type: choice
        options: [aimed, blind, decoy, wired]
        default: aimed
      engine_model:
        description: 'ENGINE_MODEL for the run (Sonnet runs without fallbacks)'
        type: choice
        options: [claude-opus-5-5, claude-sonnet-5-5]
        default: claude-opus-5-5
      editor_model:
        description: 'EDITOR_MODEL for the trial editor: default (the engine chain) or claude-sonnet-5-5 alone at EDITOR_EFFORT=low'
        type: choice
        options: [default, claude-sonnet-5-5]
        default: default
      suite_cap_usd:
        description: 'LIVE_SUITE_CAP_USD in USD, at most 150 and at least the suite need: stage-a 9, attack 12, corpus 75 (corpus_select controls 15), hard 50, oss 50, probes 1, triage 2, papers 10, web 52, prescreen 3, sweep 112, sweep-fable 41, sweep-record 24, ab 140, ab-v2-p 59, ab-v2 68 (L5b; ab_arms A, L5a, 17), escalation 43, acquire 1, noise 0 (no request, but the cap must be above 0), heal 6, oss-ab 103, evolve 104, evolve-more 138, evolve-p 56, heal-hard 8, build 27, grader 2, upstream-verify 0 (no request, but the cap must be above 0), upstream 50, agent-probes 1, heal-agent 8, research-agent 8, watch 2, watch-cleanup 2, ideas-probe 57 (E1, four libraries of ideas_repos, one 15; ideas_arms count 9, C-low,C-high 20; X1 51 for three libraries of ideas_repos, under the 80 USD fuse, one 17; X1-1 33 for the four of run 1, one 9), ideas-views 0 (no request, but the cap must be above 0), ideas-marker 24 (Vb: 48 rank sets x Opus 5.5 and Opus 5), ideas-validate 8 (Vc: the Sonnet 5 and Fable 5 smoke requests, 17 Opus 5 label requests), ideas-slice 75 (Ve: two libraries of slice_repos x (4 configurations x 3 trials x 2.50 + the markers 2.00 + the pooled tournament 5.45), one 38; under the 80 USD fuse), ideas-pool 22 (V-O40: the pooled tournament on more_itertools, mistune, markdown and idna, 4 x 5.45), ideas-reaudit 3 (V-reaudit: the pooled re-audit of the X1-1 re-run, 4 libraries x one Opus 5.5 auditor request at its 0.70 cap; run 1 measured 1.445 for four), ideas-picks 8 (V-picks, O48: the seven would-try ideas of the blind reader, one engine loop per library, each loop at its measured spend plus the reservation of its dearest request: sqlparse 1.60, more_itertools 2.15, mistune 2.15, tomli 1.65; need 7.55 under the owner cap of 8), ideas-x2 38 (X2a: x2_dispatch one arm on four libraries, 4 runs x ideas_x2.run_cap, 9.35 for X2-0 and its twin, 9.45 for X2-V (X2-D 12.90 a run, two a dispatch, 26), each run capped by the engine reservation rules at X1 measured rates with round 1 trialling the whole idea result; one run 10; under the 80 USD fuse), combine-replay 0 (no request, but the cap must be above 0), combine-order 0 (no request, but the cap must be above 0)'
        type: string
        default: '12'
      key_slot:
        description: "The API key this dispatch spends, a secret of environment 'live': 1 (ANTHROPIC_API_KEY, Window 1) or 2 (ANTHROPIC_API_KEY_2, Window 2); exported as LIVE_KEY_SLOT, and every cost-table row carries its window (W1 or W2)"
        type: choice
        options: ['1', '2']
        default: '1'
      oss_repo:
        description: 'oss-ab and evolve-p only, and required there: the one OSS library this dispatch runs (oss-ab: LIVE_OSS_AB_REPOS, from the first or second set, e.g. tabulate or toml; evolve-p: LIVE_EVOLVE_REPOS, from the first set, e.g. sqlparse, tomli or pyparsing)'
        type: string
        default: ''
      upstream_batch:
        description: 'upstream-verify and upstream only: the batch of ten upstream corpus candidates this dispatch runs (LIVE_UPSTREAM_BATCH; upstream: of the verified ones)'
        type: choice
        options: ['1', '2', '3']
        default: '1'
      order_batch:
        description: 'combine-order only: the batch of libraries this dispatch replays (LIVE_ORDER_BATCH; order_cases.BATCHES: 1 sqlparse, 2 markdown, 3 mistune and tomli)'
        type: choice
        options: ['1', '2', '3']
        default: '1'
      idea_pipeline:
        description: 'oss and corpus only: IDEA_PIPELINE (off: arm A, the current generator; on: arm P, the idea pipeline on its own lane, leap and reviewer transports; on runs wired only)'
        type: choice
        options: ['off', 'on']
        default: 'off'
      portfolio_rounds:
        description: 'oss and corpus only: PORTFOLIO_ROUNDS, the trial rounds after the first a portfolio may take (0 keeps the current router; E2 sets 2 on both arms)'
        type: choice
        options: ['0', '1', '2', '3']
        default: '0'
      corpus_select:
        description: 'corpus only: all (its 15 repositories, need 75) or controls (its three controls alone, need 15: the E2 control dispatches)'
        type: choice
        options: [all, controls]
        default: all
      ideas_arms:
        description: 'ideas-probe only: LIVE_IDEAS_ARMS, the arms each library runs (A,B,C,D,E: E1 with the auditor, four of its 8 libraries a dispatch named in ideas_repos, need 14.10 a library, 57 for four; count: E0b on the 10 OSS libraries, need 9; C-low,C-high: E1b on the facts E1 recorded, need 20; X1: arm A and X1-0 to X1-4 with the auditor on the facts E1 recorded and the views Va recorded, three of the 8 libraries a dispatch named in ideas_repos (four pass the job minutes since the 32,000-token X1-1 lanes of O42), need 16.95 a library, 51 for three; X1-1: the O42 re-run, arm A and X1-1 (its lanes at 32,000 output tokens) with the auditor on the same facts and views, the four libraries of run 1 unless ideas_repos names others, need 8.20 a library, 33 for four)'
        type: choice
        options: ['A,B,C,D,E', count, 'C-low,C-high', X1, X1-1]
        default: 'A,B,C,D,E'
      ideas_repos:
        description: 'ideas-probe only, and required for E1 and X1: LIVE_IDEAS_REPOS, comma-separated OSS library names (E1 at most four a dispatch, e.g. pyparsing,tomli,mistune,idna; X1 at most three, e.g. mistune,sqlparse,markdown then idna; X1-1 at most four, empty for the four of run 1, more_itertools,pyparsing,tomli,sortedcontainers; empty: the libraries of the arms); the need is the libraries x 14.10 (E1), 0.85 (count), 4.95 (C-low,C-high), 16.95 (X1) or 8.20 (X1-1), rounded up'
        type: string
        default: ''
      ab_arms:
        description: 'ab-v2 only: LIVE_AB_ARMS, the arms on all twelve corpus v2 repositories (A,B: L5b, arms A and B, 2 repetitions, need 68; A: L5a, arm A alone, 1 repetition, need 17)'
        type: choice
        options: ['A,B', A]
        default: 'A,B'
      slice_repos:
        description: 'ideas-slice only, and required there: LIVE_SLICE_REPOS, one or two of sqlparse, pyparsing, tomli and sortedcontainers (the control), comma-separated (two dispatches: sqlparse,pyparsing then tomli,sortedcontainers); the need is the libraries x 37.45, rounded up: 38 for one, 75 for two'
        type: string
        default: ''
      x2_dispatch:
        description: "ideas-x2 only, and required there: LIVE_X2_DISPATCH, one arm and its libraries as ARM:lib,lib (X2-0, its A/A twin X2-0' on sqlparse, pyparsing, tomli and sortedcontainers only, X2-V, X2-C, X2-0 with IDEAS_COUNT_CONTRACT=record, emergence round 1 S1, off the plan, X2-S, X2-C with SITE_STACKS=on on more_itertools, tomli, mistune and sqlparse, emergence round 1 S2, off the plan, X2-SV, X2-C with SHADOW_VERIFY=record on sqlparse, tomli and mistune, emergence round 2 S4, off the plan, or X2-D, X2-0 with three rounds and three generator calls on sqlparse, tomli, mistune and markdown, Window 2, off the plan, 12.90 and 133 minutes a run, two a dispatch, X2-P, X2-0 with the portfolio leap (U-portfolio) on sqlparse, tomli, mistune and markdown, off the plan, 10.55 and 113 minutes a run, X2-F, X2-P with the leap on Fable 5.2, off the plan, 21.10 and 113 minutes a run, two a dispatch each and x2_replicate required, or X2-L, X2-0 with the leap on Fable 5.2 (O61) on sqlparse, tomli, mistune and markdown, off the plan, 21.10 and 113 minutes a run, two a dispatch, no x2_replicate), the arm's settings exported from ideas_x2.arm_env; the plan (ideas_x2.dispatches) is five dispatches of four: X2-0:more_itertools,pyparsing,tomli,sortedcontainers then X2-0:mistune,sqlparse,markdown,idna, X2-0':sqlparse,pyparsing,tomli,sortedcontainers, and X2-V on the same two fours; the need is the libraries x 9.35 (X2-V 9.45), rounded up: 38 for four"
        type: string
        default: ''
      x2_replicate:
        description: 'ideas-x2 only, and required for X2-P and X2-F (the portfolio leap, U-portfolio): IDEAS_LEAP_DEAL_RUN, the replicate 1, 2 or 3, which the deal rotation reads (idea_frameworks.deal: library, run, round); every other arm ignores it'
        type: string
        default: ''

# Least privilege by default; a job that needs more says so itself.
permissions:
  contents: read

# Concurrency: Cancel in-progress runs for PR branches, keep all runs for main.
# Each manual (live) run is its own group and is never cancelled: it is paid
# and approved, and two dispatches on one ref (e.g. attack and corpus) must
# both run instead of the newer cancelling the older.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || 'auto' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  # Detect which packages changed for selective execution
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: read # Required for paths-filter to access PR information
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      python: ${{ steps.filter.outputs.python }}
      workflows: ${{ steps.filter.outputs.workflows }}
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
    steps:
      # Keeps the default persisted token, unlike every other job: on push,
      # paths-filter may 'git fetch' the base commit, which needs it on a
      # private repo. This job runs no repository code and uploads nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            typescript:
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - '.nvmrc'
              - 'turbo.json'
              - 'tsconfig*.json'
            python:
              - 'services/python_agents/**'
              - 'services/python_agents/pyproject.toml'
            workflows:
              - '.github/workflows/**'
            infrastructure:
              - 'infrastructure/schema/**'
              - 'docker-compose.dev.yml'

  # Shared setup for TypeScript jobs
  setup-typescript:
    name: Setup TypeScript Environment
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.typescript == 'true' ||
      needs.detect-changes.outputs.workflows == 'true' ||
      github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.20.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  # Parallel TypeScript checks
  typecheck:
    name: Type Check
    runs-on: ubuntu-22.04
    needs: setup-typescript
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.20.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

  lint:
    name: Lint Code
    runs-on: ubuntu-22.04
    needs: setup-typescript
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.20.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check (with auto-fix attempt)
        id: format-check
        run: |
          # Step 1: Check formatting
          if pnpm format:check; then
            echo "✅ All files properly formatted"
            exit 0
          fi

          # Step 2: Formatting issues found, attempt auto-fix
          echo "⚠️ Formatting issues found, attempting auto-fix..."
          pnpm format

          # Step 3: Re-check after auto-fix
          if pnpm format:check; then
            echo "✅ Auto-fix successful, but changes were made"
            echo "⚠️ This indicates formatting issues in committed code"
            exit 1
          else
            echo "❌ Auto-fix failed, manual intervention required"
            exit 1
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-22.04
    needs: setup-typescript
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.20.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Check coverage threshold
        run: pnpm test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: ./coverage
          retention-days: 14
          compression-level: 6

  # Python CI with optimizations
  python:
    name: Python CI
    runs-on: ubuntu-22.04
    needs: detect-changes
    # infrastructure too: the Postgres tests build their databases from the
    # migration files in infrastructure/schema.
    if: |
      needs.detect-changes.outputs.python == 'true' ||
      needs.detect-changes.outputs.infrastructure == 'true' ||
      needs.detect-changes.outputs.workflows == 'true' ||
      github.event_name == 'push'
    permissions:
      contents: read
    # 15 before O49's serial timed pass (about 2-3 more minutes).
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./services/python_agents
    env:
      # The engine's floor; every uv command (sync, run) uses it even after the
      # older workload interpreters are installed below.
      UV_PYTHON: '3.11'
      # The Postgres repository tests run against the service below and count
      # toward coverage (decision 30: they skip only when this is unset).
      TEST_DATABASE_URL: postgresql://dev:devpass@localhost:5432/ai_platform
      # Sandbox tests fail instead of skipping when the host cannot isolate
      # (decision 36: never weaken these; move to ubuntu-24.04 instead).
      REQUIRE_NETWORK_SANDBOX: '1'
      REQUIRE_FS_SANDBOX: '1'
    services:
      postgres:
        # pgvector on Postgres 16, pinned to a release tag and its multi-arch
        # index digest; docker-compose.dev.yml pins the same digest. Bump both
        # together.
        image: pgvector/pgvector:0.8.7-pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_DB: ai_platform
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: devpass
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U dev -d ai_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Setup uv (fast Python package installer)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Pinned: without it the action downloads whatever uv is latest.
          version: '0.11.32'
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Install dependencies with uv sync
        run: |
          uv sync --frozen --extra dev --extra database --extra experiments
          uv run python -c 'import sys; print("engine python", sys.version)'

      # The profiler shim runs on workload interpreters >= 3.8, and its tests
      # run every python3.N found on PATH (they skip the missing ones). The
      # retry's live error-message templates (spec D13) need 3.13 and 3.14 too.
      - name: Install workload interpreters 3.8 to 3.14
        run: |
          uv python install 3.8 3.9 3.10 3.11 3.12 3.13 3.14
          uv python dir --bin >> "$GITHUB_PATH"

      - name: Workload interpreters are on PATH
        run: |
          status=0
          for version in 3.8 3.9 3.10 3.11 3.12 3.13 3.14; do
            if command -v "python${version}" >/dev/null 2>&1; then
              echo "python${version}: $(command -v "python${version}") ($("python${version}" -c 'import sys; print(sys.version.split()[0])'))"
            else
              echo "::error::python${version} is not on PATH, so the profiler shim and retry template tests for it would skip"
              status=1
            fi
          done
          exit "${status}"

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Format check with Ruff
        run: uv run ruff format --check .

      - name: Type check with Mypy
        run: uv run mypy src tests

      # A known vulnerability in the synced environment (the dev, database
      # and experiments extras) fails the PR (spec D19), with the stage
      # gate's command; security.yml audits the whole lock weekly.
      - name: Audit dependencies with pip-audit
        run: uv run pip-audit --progress-spinner off

      # Fails loudly (instead of letting REQUIRE_* turn every sandbox test red)
      # when the runner cannot give the engine its Linux sandbox: the exact
      # unshare argv the engine uses, then the Landlock ABI probe.
      - name: Sandbox probe (unshare and Landlock)
        run: |
          echo "kernel $(uname -r)"
          userns=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -r "${userns}" ]; then
            echo "apparmor_restrict_unprivileged_userns=$(cat "${userns}")"
          fi
          if ! command -v unshare >/dev/null 2>&1; then
            echo "::error::unshare is not installed: the sandbox tests cannot run (REQUIRE_*=1)"
            exit 1
          fi
          uv run python - <<'PY'
          import subprocess
          import sys

          from autonomous_ai_agents.execution import launcher
          from autonomous_ai_agents.execution.sandbox import UNSHARE_ARGV

          HINT = (
              "decision 36: move this job to ubuntu-24.04 with "
              "'sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0'; "
              "never unset REQUIRE_*"
          )
          argv = [*UNSHARE_ARGV, "true"]
          probe = subprocess.run(argv, capture_output=True, timeout=30, check=False)
          if probe.returncode != 0:
              detail = probe.stderr.decode(errors="replace").strip()
              print(f"::error::{' '.join(argv)} exited {probe.returncode}: {detail} ({HINT})")
              sys.exit(1)
          print(f"{' '.join(argv)}: ok")
          try:
              abi = launcher.default_ops().syscall(444, (None, 0, 1))
          except OSError as error:
              print(f"::error::Landlock is unavailable: {error} ({HINT})")
              sys.exit(1)
          print(f"Landlock ABI {abi}")
          PY

      - name: Run tests with parallelization
        run: uv run pytest -m "not live and not timed" -n auto --cov --cov-report=xml --cov-report=term
        if: hashFiles('services/python_agents/tests/**/*.py') != ''

      # The CPU-time guards (`timed`) run once each, serially, after the
      # parallel pass, so its load never enters their figures (O49); coverage
      # appends, so the report and its floor cover both passes.
      - name: Run the timed guards alone
        run: uv run pytest -m "timed and not live" -n 0 --cov-append --cov --cov-report=xml --cov-report=term
        if: hashFiles('services/python_agents/tests/**/*.py') != ''

  # The macOS sandbox (sandbox-exec), Apple git and maxrss units, before the
  # M4 Pro dogfood (spec decision 6). Blocking since the Step 2 close-out.
  python-macos:
    name: Python execution tests (macOS)
    runs-on: macos-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.python == 'true' ||
      needs.detect-changes.outputs.workflows == 'true' ||
      github.event_name == 'push'
    permissions:
      contents: read
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./services/python_agents
    env:
      UV_PYTHON: '3.11'
      GIT_EXECUTABLE: /usr/bin/git
      REQUIRE_NETWORK_SANDBOX: '1'
      REQUIRE_FS_SANDBOX: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Setup uv (fast Python package installer)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Pinned: without it the action downloads whatever uv is latest.
          version: '0.11.32'
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Install dependencies with uv sync
        run: uv sync --frozen --extra dev

      # Same as the python job: the retry template and profiler shim tests
      # run every python3.N on PATH and fail in CI when one is missing.
      - name: Install workload interpreters 3.8 to 3.14
        run: |
          uv python install 3.8 3.9 3.10 3.11 3.12 3.13 3.14
          uv python dir --bin >> "$GITHUB_PATH"

      - name: Workload interpreters are on PATH
        run: |
          status=0
          for version in 3.8 3.9 3.10 3.11 3.12 3.13 3.14; do
            if command -v "python${version}" >/dev/null 2>&1; then
              echo "python${version}: $(command -v "python${version}") ($("python${version}" -c 'import sys; print(sys.version.split()[0])'))"
            else
              echo "::error::python${version} is not on PATH, so the profiler shim and retry template tests for it would skip"
              status=1
            fi
          done
          exit "${status}"

      - name: Sandbox probe (sandbox-exec and Apple git)
        run: |
          sw_vers
          "${GIT_EXECUTABLE}" --version
          if ! /usr/bin/sandbox-exec -p '(version 1) (allow default)' /usr/bin/true; then
            echo "::error::sandbox-exec cannot run a profile: the sandbox tests cannot run (REQUIRE_*=1)"
            exit 1
          fi
          echo "sandbox-exec: ok"

      - name: Run execution tests
        run: uv run pytest tests/execution --no-cov -m "not live and not timed" -n auto

  # Live Claude smoke test: costs money, so it runs only when started by hand
  # (Actions > CI > Run workflow), never on push or pull_request. The key is
  # passed to the test step only and never echoed (GitHub masks it as well).
  # Environment 'live' holds two keys as environment secrets (not repository
  # secrets): ANTHROPIC_API_KEY (key_slot 1, Window 1) and ANTHROPIC_API_KEY_2
  # (key_slot 2, Window 2); the run step reads only the slot's. The owner
  # removed its required reviewers on 2026-10-24 (STATUS.md), so each run's
  # hard cost cap is what bounds the spend.
  live-smoke:
    name: Live Claude API suite (manual)
    runs-on: ubuntu-22.04
    if: github.event_name == 'workflow_dispatch'
    environment: live
    permissions:
      contents: read
    # Each whole loop takes a few minutes of real trials (up to about 8): Stage A
    # runs 2, attack 3, corpus 15, hard 10 and oss at most 10 (larger
    # repositories). A killed job loses the cost table, so each suite gets room
    # for its loops (the hosted maximum is 360). Under the Step 3 noise rule
    # (paired trials, confirmation, calibration) and wired ideas, L1a and L1b
    # measured hard 28-29 and corpus 34 minutes (2.3-2.9 a loop, 2026-10-25),
    # so both sit at the 8-minutes-a-loop floor: hard 90, corpus 120. oss
    # keeps 300: L2a measured 36-40 minutes for its 10 loops, and arm P or A
    # at portfolio_rounds 2 (E2) at most doubles the trials (re-pinned from
    # E2's first dispatch). ideas-probe 240 (ideas_probe.JOB_MINUTES): each
    # request twice E1's slowest of its role and model (ideas_probe.E1_SECONDS,
    # re-pinned from E1's recorded seconds; a parallel stage the slowest of
    # each round of four workers) and 2 minutes for phase 1 (E0b: a
    # count-mode library about 47 s): E1 49 a library (196 for four; arm D's
    # Fable leap may run to its 951 s timeout); X1 74
    # to 76 a library on recorded facts (O42: an X1-1 lane at 32,000 tokens
    # takes twice its model's slowest X1 run-1 rate, over any reply of 1,000
    # tokens or more, over the cap: Fable 5.1 951 s, Fable 5 924 s, Opus 5.5
    # 895 s from X1-3's leap, so each round of four takes 895 to 951 s), so
    # three a dispatch (224 or 228 minutes; X1 run 1 took 54 for four at
    # 12,000); O42's X1-1 re-run 47 to 50 a library, 193 for run 1's four;
    # E0b's ten 4 each, E1b's four 16 each.
    # ideas-views 30
    # (ideas_views.VIEWS_JOB_MINUTES): no request, 8 libraries at 2 minutes
    # each (a fresh clone with its tag's history, then six views of seconds),
    # 16 minutes, about twice what they need. ideas-marker 240
    # (ideas_marker.JOB_MINUTES): 17 pinned clones at 1 minute and 96
    # ordering requests (48 rank sets x 2 markers, high effort) at 2 minutes
    # each, about twice one short structured reply: 209 minutes. ideas-validate 60
    # (ideas_validate.JOB_MINUTES): 2 smoke requests and 17 label requests
    # at 2 minutes each (one reply of about 3k output tokens at medium
    # effort, 2x margin), 38 minutes, no clone. ideas-slice 150
    # (ideas_slice.JOB_MINUTES): two libraries, each a pinned clone (1
    # minute), 8 marker requests at Vb's 2 minutes, the pooled tournament's
    # 22 set requests at its 40-idea bound at 30 s (O41; Opus 5 measured 5.4 s
    # a set, Opus 5.5 3.1 s: 11 minutes) and 4 engine loops of up to 3
    # trials at 9 minutes (L2b: 42 minutes for 10 OSS loops of up to 3
    # trials under the Step 3 noise rule, 4.2 a loop, twice that): 128.
    # ideas-pool 60 (ideas_pool.JOB_MINUTES): four libraries, each a pinned
    # clone (1 minute) and the tournament's 22 set requests at 30 s: 48.
    # ideas-reaudit 30 (ideas_reaudit.JOB_MINUTES): four libraries, each a
    # pinned clone (1 minute), the replay of seven recorded arms (1 minute;
    # run 1's five took under 1 s) and one auditor request at twice E1's
    # slowest (217 s, 4 minutes): 24. ideas-picks 45 (ideas_picks.JOB_MINUTES):
    # four engine loops (sqlparse 3 trials, more_itertools 2, mistune 1, tomli
    # 1), each a fresh clone, at the slice's 9 minutes a loop (its dispatches
    # took 33 and 29 minutes for eight loops with markers and tournaments,
    # about 4 a loop, twice that): 36.
    # ideas-x2 360 (ideas_x2.JOB_MINUTES,
    # GitHub's ceiling): four whole engine runs a dispatch, each a pinned
    # clone (1 minute), two rounds of trials (round 1 the whole idea result,
    # 10; round 2 the seeded call's 10 and one compound) in loops of 3 at
    # L2b's whole wired OSS run, twice its measured 4.2 minutes (8 loops x 9)
    # and two idea pipeline calls at ideas_probe.arm_seconds' worst (443 s,
    # twice E1's slowest request each, 8 minutes each): 89 a run, 356;
    # X2-D's third round (and third call) adds 4 loops and a call, 133 a
    # run, two (266). combine-replay 105 (combine_replay.REPLAY_JOB_MINUTES,
    # O62 item 5): no request, five cases (four archived tips re-tested three
    # times, markdown calibrated and profiled), each a pinned clone (1
    # minute) and units of one re-test at its library's upper bound from the
    # archived X2-D and X2-P runs (seconds_measured over trials, keeps and
    # the combine: tomli 50 s, mistune 57, sqlparse 64, markdown 60): the
    # preflight, the baseline, 3 calibration blocks, the profile once a
    # library and the looks, 45 minutes; 15 for setup plus twice that.
    # combine-order 117 (order_cases.ORDER_JOB_MINUTES, O65 item 2): no
    # request; per library a clone, one baseline with its calibration and
    # every archived held combine (four looks of the two choices, each with
    # its fallback, and one per keep of a conflicting pair, an upper bound),
    # at combine-replay run 43194422719's measured times (baseline step
    # 22-52 s, one look 6-14 s): 145 minutes for all 59 runs, so three
    # batches (order_batch: 47, 48 and 51); 15 for setup plus twice the largest.
    timeout-minutes: ${{ inputs.suite == 'sweep' && 240 || inputs.suite == 'sweep-fable' && 180 || inputs.suite == 'sweep-record' && 150 || inputs.suite == 'ab' && 360 || inputs.suite == 'noise' && 90 || inputs.suite == 'oss-ab' && 120 || inputs.suite == 'evolve' && 300 || inputs.suite == 'evolve-more' && 300 || inputs.suite == 'evolve-p' && 300 || inputs.suite == 'ab-v2-p' && 300 || inputs.suite == 'ab-v2' && 300 || inputs.suite == 'build' && 120 || inputs.suite == 'upstream-verify' && 150 || inputs.suite == 'upstream' && 300 || inputs.suite == 'heal-agent' && 120 || inputs.suite == 'research-agent' && 45 || inputs.suite == 'ideas-probe' && 240 || inputs.suite == 'ideas-views' && 30 || inputs.suite == 'ideas-marker' && 240 || inputs.suite == 'ideas-validate' && 60 || inputs.suite == 'ideas-slice' && 150 || inputs.suite == 'ideas-pool' && 60 || inputs.suite == 'ideas-reaudit' && 30 || inputs.suite == 'ideas-picks' && 45 || inputs.suite == 'ideas-x2' && 360 || inputs.suite == 'combine-replay' && 105 || inputs.suite == 'combine-order' && 117 || inputs.suite == 'watch' && 90 || inputs.suite == 'escalation' && 90 || inputs.suite == 'triage' && 90 || inputs.suite == 'papers' && 60 || inputs.suite == 'web' && 90 || inputs.suite == 'corpus' && 120 || inputs.suite == 'oss' && 300 || inputs.suite == 'hard' && 90 || inputs.suite == 'attack' && 45 || 30 }}
    defaults:
      run:
        working-directory: ./services/python_agents
    env:
      # CPython 3.11 as the python job, except the upstream corpus suites: the
      # networkx before-trees need 3.12, which every candidate admits
      # (upstream.UPSTREAM_PYTHON; prepare_repo refuses one outside its range).
      UV_PYTHON: ${{ (inputs.suite == 'upstream' || inputs.suite == 'upstream-verify') && '3.12' || '3.11' }}
      # The live E2E and attack runs must be sandboxed: a runner that cannot
      # isolate fails instead of running Claude-edited code unconfined.
      REQUIRE_NETWORK_SANDBOX: '1'
      REQUIRE_FS_SANDBOX: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.UV_PYTHON }}

      - name: Setup uv (fast Python package installer)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Pinned: without it the action downloads whatever uv is latest.
          version: '0.11.32'
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Install dependencies with uv sync
        run: uv sync --frozen --extra dev --extra database --extra experiments

      # The same probe as the python job: fail loudly before any money is
      # spent when the runner cannot give the engine its Linux sandbox.
      - name: Sandbox probe (unshare and Landlock)
        run: |
          echo "kernel $(uname -r)"
          userns=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -r "${userns}" ]; then
            echo "apparmor_restrict_unprivileged_userns=$(cat "${userns}")"
          fi
          if ! command -v unshare >/dev/null 2>&1; then
            echo "::error::unshare is not installed: the live E2E cannot be sandboxed (REQUIRE_*=1)"
            exit 1
          fi
          uv run python - <<'PY'
          import subprocess
          import sys

          from autonomous_ai_agents.execution import launcher
          from autonomous_ai_agents.execution.sandbox import UNSHARE_ARGV

          HINT = (
              "decision 36: move this job to ubuntu-24.04 with "
              "'sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0'; "
              "never unset REQUIRE_*"
          )
          argv = [*UNSHARE_ARGV, "true"]
          probe = subprocess.run(argv, capture_output=True, timeout=30, check=False)
          if probe.returncode != 0:
              detail = probe.stderr.decode(errors="replace").strip()
              print(f"::error::{' '.join(argv)} exited {probe.returncode}: {detail} ({HINT})")
              sys.exit(1)
          print(f"{' '.join(argv)}: ok")
          try:
              abi = launcher.default_ops().syscall(444, (None, 0, 1))
          except OSError as error:
              print(f"::error::Landlock is unavailable: {error} ({HINT})")
              sys.exit(1)
          print(f"Landlock ABI {abi}")
          PY

      # -m live replaces the default "not live" filter; --no-cov because the
      # live tests alone cannot meet the suite's coverage gate; -n 0 so one
      # session ledger sees every test. The key reaches only this step and is
      # never printed; a missing key fails here instead of letting every live
      # test skip. The inputs arrive through env only and are validated before
      # anything runs: the suite picks the paths, the model sets ENGINE_MODEL
      # (Sonnet with ENGINE_FALLBACKS off, so the comparison bills Sonnet only
      # and its worst case is priced on Sonnet alone), and the cap becomes
      # LIVE_SUITE_CAP_USD, which tests/live/conftest.py enforces before each
      # test spends. The mode becomes LIVE_CORPUS_MODE (the corpus, hard and
      # oss suites read it; stage-a and attack ignore it). editor_model sets
      # EDITOR_MODEL with EDITOR_EFFORT=low, which start_loop and
      # start_oss_loop give its own captured editor transport. Every suite gets
      # its noise rule explicitly. The cost table and
      # the corpus summary go to the job summary; one JSON line per corpus run
      # goes to LIVE_RESULTS_PATH.
      - name: Run live tests
        env:
          # The slot's secret only (U-key): an index, not '||', so an empty
          # ANTHROPIC_API_KEY_2 is refused below instead of falling back to key 1.
          ANTHROPIC_API_KEY: ${{ secrets[inputs.key_slot == '2' && 'ANTHROPIC_API_KEY_2' || 'ANTHROPIC_API_KEY'] }}
          INPUT_KEY_SLOT: ${{ inputs.key_slot }}
          INPUT_SUITE: ${{ inputs.suite }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_ENGINE_MODEL: ${{ inputs.engine_model }}
          INPUT_EDITOR_MODEL: ${{ inputs.editor_model }}
          INPUT_SUITE_CAP_USD: ${{ inputs.suite_cap_usd }}
          INPUT_OSS_REPO: ${{ inputs.oss_repo }}
          INPUT_UPSTREAM_BATCH: ${{ inputs.upstream_batch }}
          INPUT_IDEA_PIPELINE: ${{ inputs.idea_pipeline }}
          INPUT_PORTFOLIO_ROUNDS: ${{ inputs.portfolio_rounds }}
          INPUT_CORPUS_SELECT: ${{ inputs.corpus_select }}
          INPUT_IDEAS_ARMS: ${{ inputs.ideas_arms }}
          INPUT_IDEAS_REPOS: ${{ inputs.ideas_repos }}
          INPUT_AB_ARMS: ${{ inputs.ab_arms }}
          INPUT_SLICE_REPOS: ${{ inputs.slice_repos }}
          INPUT_X2_DISPATCH: ${{ inputs.x2_dispatch }}
          INPUT_X2_REPLICATE: ${{ inputs.x2_replicate }}
          INPUT_ORDER_BATCH: ${{ inputs.order_batch }}
          LIVE_RESULTS_PATH: ${{ runner.temp }}/live-results.jsonl
        run: |
          # The key slot (U-key): 1 is ANTHROPIC_API_KEY (Window 1), 2 is
          # ANTHROPIC_API_KEY_2 (Window 2). In Actions the step's env always
          # sets INPUT_KEY_SLOT, so the default of 1 applies only outside
          # Actions (the guard harness); a real empty or other value is
          # refused. The slot reaches the tests as LIVE_KEY_SLOT, which
          # labels every cost-table row W1 or W2.
          key_slot="${INPUT_KEY_SLOT-1}"
          case "${key_slot}" in
            1) key_secret=ANTHROPIC_API_KEY ;;
            2) key_secret=ANTHROPIC_API_KEY_2 ;;
            *)
              echo "::error::unknown key_slot input (1 or 2)"
              exit 1
              ;;
          esac
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::key_slot ${key_slot}: the ${key_secret} secret of environment 'live' is not set"
            exit 1
          fi
          export LIVE_KEY_SLOT="${key_slot}"
          corpus=(--ignore=tests/live/test_corpus_live.py --ignore=tests/live/test_attack_corpus_live.py --ignore=tests/live/test_hard_corpus_live.py --ignore=tests/live/test_oss_live.py --ignore=tests/live/experiments --ignore=tests/live/test_sweep_live.py --ignore=tests/live/test_ab_live.py --ignore=tests/live/test_escalation_live.py --ignore=tests/live/test_noise_live.py --ignore=tests/live/test_oss_ab_live.py --ignore=tests/live/test_evolution_live.py --ignore=tests/live/test_build_live.py --ignore=tests/live/test_grader_agreement_live.py --ignore=tests/live/test_upstream_verify_live.py --ignore=tests/live/test_upstream_live.py --ignore=tests/live/test_ideas_probe_live.py --ignore=tests/live/test_ideas_views_live.py --ignore=tests/live/test_ideas_marker_live.py --ignore=tests/live/test_ideas_validate_live.py --ignore=tests/live/test_ideas_slice_live.py --ignore=tests/live/test_ideas_pool_live.py --ignore=tests/live/test_ideas_reaudit_live.py --ignore=tests/live/test_ideas_picks_live.py --ignore=tests/live/test_ideas_x2_live.py --ignore=tests/live/test_combine_replay_live.py --ignore=tests/live/test_combine_order_live.py)
          # need: the sum of the caps the suite's live tests ask the ledger for
          # (Stage A 8.55, corpus 15 x 5, attack 3 x 4, hard 10 x 5, oss at most
          # 10 x 5; the Window 0 experiments under tests/live/experiments: probes
          # 0.46, triage 1.25, papers 3 x 1.25 + 2 x 2.75 + 0.75, web 18 caps 51.08, prescreen 2 x 1.11; the discovery
          # suites, the sweeps on 37 repositories (v1, hard and v2: 32 slowdowns,
          # 5 controls): sweep 111.75, sweep-fable 40.3 (one Sonnet arm and
          # Fable 5.1 on the 12 v1 slowdowns), sweep-record 23.5 (one Sonnet
          # arm, recorded), ab 2
          # reps 140, escalation 42.9; acquire 0.60 (Part B; Part A is free);
          # noise 0 (no request); heal 8 x 0.75; oss-ab one library 102.6 (2
          # reps x (1.30 generation + 2 arms x 10 trials x 2.50)); evolve 3
          # repos x 10 rounds x (0.45 + 3); evolve-more the same on 4 more
          # libraries, 138; V8's arm P, on D55's bounds as E0b re-derived them
          # (D61): ab-v2-p (E3) 2 reps x 6 v2 repos x (2.90 generation, phase
          # 1, arm A and the whole idea pipeline, + 2 x 1.00), 58.8; V10's
          # ab-v2 (L5b) 2 reps x 12 v2 repos x (0.80 + 2 x 1.00), 67.2, and
          # ab_arms A (L5a) 1 rep x 12 x (0.35 + 1.00), 16.2; evolve-p
          # (E4) one library x 6 rounds x (blind 0.45 + 3 + arm P 2.75 + 3),
          # 55.2; heal-hard 10 x 0.75; build 3 specs x (0.80 build +
          # 0.60 generation + 7.50 loop)); grader 6 repositories x 0.22725
          # (L3, one grader request each); upstream-verify 0 (no request);
          # upstream a batch of 10 verified candidates x 5 (one wired loop each);
          # agent-probes 0.97 (A0: five probes at 0, 0, 0.47, 0.30 and 0.20);
          # heal-agent 12 new bugs x 0.40 + 16 regression bugs x 0.20 (P1,
          # A1: one run per bug, both arms);
          # research-agent 7.35 (A2: arm A 5 x 1.14, arm B 5 x 0.30, the
          # builder's injection page 0.15; each A2s page adds 0.15);
          # watch 1.85 (A3: one hosted run's worst case, the 25-cent session
          # budget + one maximal Haiku 5.5 request + 22 watched minutes, 1.60,
          # and a listing's triage, 0.25); watch-cleanup 1.60 (one session no
          # ledger saw); ideas-probe E1 56.4 (4 libraries a dispatch x 14.10,
          # on D55's bounds re-derived from E0b's counts: phase 1 0.38, arms A
          # 0.27, B 1.99, C 2.475, D 7.205 (its Fable leap at 32,000 tokens
          # with Opus 4.8 as fallback), E 1.045, the auditor 0.69), E0b
          # count 8.5 (10 x 0.85, 0.38 + 2 x 0.215), E1b 19.8 (4 x 2 x 2.475
          # on recorded facts), X1 50.85 (Vd: 3 libraries a dispatch x 16.95 on
          # E1's facts: A 0.27, X1-0 2.475, X1-1 7.216 with each lens on its
          # square's model and S1 and the lenses at 32,000 output tokens (O42),
          # X1-2 2.539 with the mechanisms block, X1-3 2.675 on the views'
          # bounds, X1-4 1.075 for S1 and its four rule-relaxing lanes alone
          # (O38), the auditor 0.69, rounded up to 0.05; four would be 67.80,
          # under the 80 USD fuse, but pass the job's minutes), X1-1 32.80
          # (O42's re-run: run 1's 4 libraries x 8.20, A 0.27 + X1-1 7.216 +
          # the auditor 0.69), ideas-views 0 (Va: no request, the views pass),
          # ideas-marker 24.0 (Vb: 17 libraries, each its
          # rank sets with a kept idea and a rival x (Opus 5.5 0.22 + Opus 5
          # 0.275, 12,000 counted tokens at 8,000) rounded up to 0.05; 48 sets),
          # ideas-validate 8.0 (Vc: the smokes 0.05 Sonnet
          # 5 + 0.15 Fable 5, each 3,000 counted tokens at 2,048, and 17 Opus 5
          # label requests x 0.45625, 25,000 counted tokens at 12,000, 7.80),
          # ideas-slice 74.9 (Ve: 2 libraries a dispatch x (4 configurations x
          # 3 trials x 2.50, E2's per-trial worst case, + the markers' 2.00:
          # 4 sets x (Opus 5.5 0.22 + Opus 5 0.275) rounded up, + O41's pooled
          # tournament 5.45: 11 set requests a marker on a pool at its bound of
          # 40 ideas, 4 results of at most GENERATOR_N + IDEAS_PORTFOLIO_MAX,
          # x (0.22 + 0.275)); one 37.45), ideas-pool 21.8 (V-O40: the same
          # tournament on the four libraries outside the slice, 4 x 5.45; at
          # the measured 0.0185 and 0.0267 USD a set about 0.13 a library),
          # ideas-reaudit 2.8 (V-reaudit: 4 libraries x the auditor request's
          # worst case, 0.69 rounded up to a 0.70 cap; run 1 measured 1.445),
          # ideas-picks 7.55 (V-picks, O48: four engine loops, each its
          # measured spend from the slice's cost tables plus the engine's
          # dearest reservation at the widest measured prompt, rounded up to
          # 0.05: sqlparse 1.60, more_itertools 2.15, mistune 2.15, tomli 1.65),
          # ideas-x2 37.8 (X2a: x2_dispatch one arm on four libraries, 4 runs x
          # ideas_x2.run_cap's 9.45 for X2-V, 9.35 for X2-0; set from the
          # dispatch's libraries in its own block below), combine-replay 0
          # (O62 item 5: no request, the archived tips re-measured),
          # combine-order 0 (O65 item 2: no request, both conflict choices),
          # rounded up; a smaller cap would refuse, and fail, the later
          # tests of the suite.
          case "${INPUT_SUITE}" in
            stage-a) paths=(tests/live tests/execution/test_editor.py "${corpus[@]}"); need=9 ;;
            corpus) paths=(tests/live/test_corpus_live.py); need=75 ;;
            attack) paths=(tests/live/test_attack_corpus_live.py); need=12 ;;
            hard) paths=(tests/live/test_hard_corpus_live.py); need=50 ;;
            oss) paths=(tests/live/test_oss_live.py); need=50 ;;
            probes) paths=(tests/live/experiments/test_probes_live.py); need=1 ;;
            triage) paths=(tests/live/experiments/test_triage_live.py); need=2 ;;
            papers) paths=(tests/live/experiments/test_extraction_live.py); need=10 ;;
            web) paths=(tests/live/experiments/test_web_live.py); need=52 ;;
            prescreen) paths=(tests/live/experiments/test_prescreen_live.py); need=3 ;;
            sweep) paths=(tests/live/test_sweep_live.py); need=112 ;;
            sweep-fable) paths=(tests/live/test_sweep_live.py); need=41 ;;
            sweep-record) paths=(tests/live/test_sweep_live.py); need=24 ;;
            ab) paths=(tests/live/test_ab_live.py); need=140 ;;
            ab-v2-p) paths=(tests/live/test_ab_live.py); need=59 ;;
            ab-v2) paths=(tests/live/test_ab_live.py); need=68 ;;
            escalation) paths=(tests/live/test_escalation_live.py); need=43 ;;
            acquire) paths=(tests/live/experiments/test_acquire_live.py); need=1 ;;
            noise) paths=(tests/live/test_noise_live.py); need=0 ;;
            heal) paths=(tests/live/experiments/test_heal_live.py); need=6 ;;
            oss-ab) paths=(tests/live/test_oss_ab_live.py); need=103 ;;
            evolve) paths=(tests/live/test_evolution_live.py); need=104 ;;
            evolve-more) paths=(tests/live/test_evolution_live.py); need=138 ;;
            evolve-p) paths=(tests/live/test_evolution_live.py); need=56 ;;
            heal-hard) paths=(tests/live/experiments/test_heal_live.py); need=8 ;;
            build) paths=(tests/live/test_build_live.py); need=27 ;;
            grader) paths=(tests/live/test_grader_agreement_live.py); need=2 ;;
            upstream-verify) paths=(tests/live/test_upstream_verify_live.py); need=0 ;;
            upstream) paths=(tests/live/test_upstream_live.py); need=50 ;;
            agent-probes) paths=(tests/live/experiments/test_agent_probes_live.py); need=1 ;;
            heal-agent) paths=(tests/live/experiments/test_heal_agent_live.py); need=8 ;;
            research-agent) paths=(tests/live/experiments/test_research_agent_live.py); need=8 ;;
            watch) paths=(tests/live/experiments/test_watch_managed_live.py); need=2 ;;
            watch-cleanup) paths=(tests/live/experiments/test_watch_managed_live.py); need=2 ;;
            ideas-probe) paths=(tests/live/test_ideas_probe_live.py); need=57 ;;
            ideas-views) paths=(tests/live/test_ideas_views_live.py); need=0 ;;
            ideas-marker) paths=(tests/live/test_ideas_marker_live.py); need=24 ;;
            ideas-validate) paths=(tests/live/test_ideas_validate_live.py); need=8 ;;
            ideas-slice) paths=(tests/live/test_ideas_slice_live.py); need=75 ;;
            ideas-pool) paths=(tests/live/test_ideas_pool_live.py); need=22 ;;
            ideas-reaudit) paths=(tests/live/test_ideas_reaudit_live.py); need=3 ;;
            ideas-picks) paths=(tests/live/test_ideas_picks_live.py); need=8 ;;
            ideas-x2) paths=(tests/live/test_ideas_x2_live.py); need=38 ;;
            combine-replay) paths=(tests/live/test_combine_replay_live.py); need=0 ;;
            combine-order) paths=(tests/live/test_combine_order_live.py); need=0 ;;
            *)
              echo "::error::unknown suite input (stage-a, corpus, attack, hard, oss, probes, triage, papers, web, prescreen, sweep, sweep-fable, sweep-record, ab, ab-v2-p, ab-v2, escalation, acquire, noise, heal, oss-ab, evolve, evolve-more, evolve-p, heal-hard, build, grader, upstream-verify, upstream, agent-probes, heal-agent, research-agent, watch, watch-cleanup, ideas-probe, ideas-views, ideas-marker, ideas-validate, ideas-slice, ideas-pool, ideas-reaudit, ideas-picks, ideas-x2, combine-replay or combine-order)"
              exit 1
              ;;
          esac
          # The arm of an oss or corpus run (V4 amended, E2): IDEA_PIPELINE
          # (arm P, wired only: the factory then needs the lane, leap and
          # reviewer transports corpus.role_wiring captures) and
          # PORTFOLIO_ROUNDS, both exported explicitly for those two suites
          # and refused for every other; corpus_select=controls runs the
          # corpus suite's three controls alone (3 x 5 USD). An unset input
          # (an older caller) reads as its default, an empty one is refused.
          case "${INPUT_IDEA_PIPELINE-off}" in
            off) idea_pipeline=false ;;
            on) idea_pipeline=true ;;
            *)
              echo "::error::unknown idea_pipeline input (off or on)"
              exit 1
              ;;
          esac
          case "${INPUT_PORTFOLIO_ROUNDS-0}" in
            0 | 1 | 2 | 3) portfolio_rounds="${INPUT_PORTFOLIO_ROUNDS-0}" ;;
            *)
              echo "::error::unknown portfolio_rounds input (0, 1, 2 or 3)"
              exit 1
              ;;
          esac
          if [ "${INPUT_SUITE}" = oss ] || [ "${INPUT_SUITE}" = corpus ]; then
            if [ "${idea_pipeline}" = true ] && [ "${INPUT_MODE}" != wired ]; then
              echo "::error::idea_pipeline on runs wired only (mode wired)"
              exit 1
            fi
            export IDEA_PIPELINE="${idea_pipeline}" PORTFOLIO_ROUNDS="${portfolio_rounds}"
          elif [ "${idea_pipeline}" = true ] || [ "${portfolio_rounds}" != 0 ]; then
            echo "::error::idea_pipeline and portfolio_rounds are only for the oss and corpus suites"
            exit 1
          fi
          case "${INPUT_CORPUS_SELECT-all}" in
            all) ;;
            controls)
              if [ "${INPUT_SUITE}" != corpus ]; then
                echo "::error::corpus_select controls is only for the corpus suite"
                exit 1
              fi
              paths=("tests/live/test_corpus_live.py::test_corpus_whole_loop[blockhash]" "tests/live/test_corpus_live.py::test_corpus_whole_loop[sortstats]" "tests/live/test_corpus_live.py::test_corpus_whole_loop[lettertally]")
              need=15
              ;;
