name: CI

on:
  pull_request:
  push:
    branches: [master, main]
  # Manual runs execute only the live Claude smoke test (job live-smoke); every
  # other job is skipped for this event. The inputs choose what live-smoke runs
  # (STATUS Window 0: stage-a, the benchmark corpus E0, the attack corpus X,
  # the hard corpus, the open-source repositories), what each corpus run is
  # handed (mode), the editor model (stage M) and the suite's hard cap. There
  # is no "every suite" choice: together they need more (196 USD) than the
  # 150 USD ceiling of suite_cap_usd, so they are dispatched one by one.
  workflow_dispatch:
    inputs:
      suite:
        description: 'Live suite: stage-a, corpus, attack, hard, oss, or an experiment (probes, triage, papers, web, prescreen, sweep, sweep-fable, sweep-record, ab, escalation, acquire, noise, heal, oss-ab, evolve, evolve-more, heal-hard, build, grader, upstream-verify, upstream, agent-probes, heal-agent, research-agent, watch, watch-cleanup) (one at a time: together they need more than the 150 USD ceiling)'
        type: choice
        options:
          [
            stage-a,
            corpus,
            attack,
            hard,
            oss,
            probes,
            triage,
            papers,
            web,
            prescreen,
            sweep,
            sweep-fable,
            sweep-record,
            ab,
            escalation,
            acquire,
            noise,
            heal,
            oss-ab,
            evolve,
            evolve-more,
            heal-hard,
            build,
            grader,
            upstream-verify,
            upstream,
            agent-probes,
            heal-agent,
            research-agent,
            watch,
            watch-cleanup,
          ]
        default: stage-a
      mode:
        description: 'Corpus mode (LIVE_CORPUS_MODE): aimed (both manifest hypotheses), blind (one generic hypothesis), decoy (the neutral one alone), wired (none: the engine generates them)'
        type: choice
        options: [aimed, blind, decoy, wired]
        default: aimed
      engine_model:
        description: 'ENGINE_MODEL for the run (Sonnet runs without fallbacks)'
        type: choice
        options: [claude-opus-5-5, claude-sonnet-5-5]
        default: claude-opus-5-5
      editor_model:
        description: 'EDITOR_MODEL for the trial editor: default (the engine chain) or claude-sonnet-5-5 alone at EDITOR_EFFORT=low'
        type: choice
        options: [default, claude-sonnet-5-5]
        default: default
      suite_cap_usd:
        description: 'LIVE_SUITE_CAP_USD in USD, at most 150 and at least the suite need: stage-a 9, attack 12, corpus 75, hard 50, oss 50, probes 1, triage 2, papers 10, web 52, prescreen 3, sweep 112, sweep-fable 41, sweep-record 24, ab 140, escalation 43, acquire 1, noise 0 (no request, but the cap must be above 0), heal 6, oss-ab 103, evolve 104, evolve-more 138, heal-hard 8, build 27, grader 2, upstream-verify 0 (no request, but the cap must be above 0), upstream 50, agent-probes 1, heal-agent 8, research-agent 8, watch 2, watch-cleanup 2'
        type: string
        default: '12'
      oss_repo:
        description: 'oss-ab only, and required there: the one OSS library this dispatch runs (LIVE_OSS_AB_REPOS), from the first or second set, e.g. tabulate or toml'
        type: string
        default: ''
      upstream_batch:
        description: 'upstream-verify and upstream only: the batch of ten upstream corpus candidates this dispatch runs (LIVE_UPSTREAM_BATCH; upstream: of the verified ones)'
        type: choice
        options: ['1', '2', '3']
        default: '1'

# Least privilege by default; a job that needs more says so itself.
permissions:
  contents: read

# Concurrency: Cancel in-progress runs for PR branches, keep all runs for main.
# Each manual (live) run is its own group and is never cancelled: it is paid
# and approved, and two dispatches on one ref (e.g. attack and corpus) must
# both run instead of the newer cancelling the older.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || 'auto' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  # Detect which packages changed for selective execution
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: read # Required for paths-filter to access PR information
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      python: ${{ steps.filter.outputs.python }}
      workflows: ${{ steps.filter.outputs.workflows }}
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
    steps:
      # Keeps the default persisted token, unlike every other job: on push,
      # paths-filter may 'git fetch' the base commit, which needs it on a
      # private repo. This job runs no repository code and uploads nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            typescript:
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - '.nvmrc'
              - 'turbo.json'
              - 'tsconfig*.json'
            python:
              - 'services/python_agents/**'
              - 'services/python_agents/pyproject.toml'
            workflows:
              - '.github/workflows/**'
            infrastructure:
              - 'infrastructure/schema/**'
              - 'docker-compose.dev.yml'

  # Shared setup for TypeScript jobs
  setup-typescript:
    name: Setup TypeScript Environment
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.typescript == 'true' ||
      needs.detect-changes.outputs.workflows == 'true' ||
      github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.20.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  # Parallel TypeScript checks
  typecheck:
    name: Type Check
    runs-on: ubuntu-22.04
    needs: setup-typescript
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.20.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

  lint:
    name: Lint Code
    runs-on: ubuntu-22.04
    needs: setup-typescript
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.20.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check (with auto-fix attempt)
        id: format-check
        run: |
          # Step 1: Check formatting
          if pnpm format:check; then
            echo "✅ All files properly formatted"
            exit 0
          fi

          # Step 2: Formatting issues found, attempt auto-fix
          echo "⚠️ Formatting issues found, attempting auto-fix..."
          pnpm format

          # Step 3: Re-check after auto-fix
          if pnpm format:check; then
            echo "✅ Auto-fix successful, but changes were made"
            echo "⚠️ This indicates formatting issues in committed code"
            exit 1
          else
            echo "❌ Auto-fix failed, manual intervention required"
            exit 1
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-22.04
    needs: setup-typescript
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.20.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Check coverage threshold
        run: pnpm test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: ./coverage
          retention-days: 14
          compression-level: 6

  # Python CI with optimizations
  python:
    name: Python CI
    runs-on: ubuntu-22.04
    needs: detect-changes
    # infrastructure too: the Postgres tests build their databases from the
    # migration files in infrastructure/schema.
    if: |
      needs.detect-changes.outputs.python == 'true' ||
      needs.detect-changes.outputs.infrastructure == 'true' ||
      needs.detect-changes.outputs.workflows == 'true' ||
      github.event_name == 'push'
    permissions:
      contents: read
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./services/python_agents
    env:
      # The engine's floor; every uv command (sync, run) uses it even after the
      # older workload interpreters are installed below.
      UV_PYTHON: '3.11'
      # The Postgres repository tests run against the service below and count
      # toward coverage (decision 30: they skip only when this is unset).
      TEST_DATABASE_URL: postgresql://dev:devpass@localhost:5432/ai_platform
      # Sandbox tests fail instead of skipping when the host cannot isolate
      # (decision 36: never weaken these; move to ubuntu-24.04 instead).
      REQUIRE_NETWORK_SANDBOX: '1'
      REQUIRE_FS_SANDBOX: '1'
    services:
      postgres:
        # pgvector on Postgres 16, pinned to a release tag and its multi-arch
        # index digest; docker-compose.dev.yml pins the same digest. Bump both
        # together.
        image: pgvector/pgvector:0.8.7-pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_DB: ai_platform
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: devpass
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U dev -d ai_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Setup uv (fast Python package installer)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Pinned: without it the action downloads whatever uv is latest.
          version: '0.11.32'
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Install dependencies with uv sync
        run: |
          uv sync --frozen --extra dev --extra database --extra experiments
          uv run python -c 'import sys; print("engine python", sys.version)'

      # The profiler shim runs on workload interpreters >= 3.8, and its tests
      # run every python3.N found on PATH (they skip the missing ones). The
      # retry's live error-message templates (spec D13) need 3.13 and 3.14 too.
      - name: Install workload interpreters 3.8 to 3.14
        run: |
          uv python install 3.8 3.9 3.10 3.11 3.12 3.13 3.14
          uv python dir --bin >> "$GITHUB_PATH"

      - name: Workload interpreters are on PATH
        run: |
          status=0
          for version in 3.8 3.9 3.10 3.11 3.12 3.13 3.14; do
            if command -v "python${version}" >/dev/null 2>&1; then
              echo "python${version}: $(command -v "python${version}") ($("python${version}" -c 'import sys; print(sys.version.split()[0])'))"
            else
              echo "::error::python${version} is not on PATH, so the profiler shim and retry template tests for it would skip"
              status=1
            fi
          done
          exit "${status}"

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Format check with Ruff
        run: uv run ruff format --check .

      - name: Type check with Mypy
        run: uv run mypy src tests

      # A known vulnerability in the synced environment (the dev, database
      # and experiments extras) fails the PR (spec D19), with the stage
      # gate's command; security.yml audits the whole lock weekly.
      - name: Audit dependencies with pip-audit
        run: uv run pip-audit --progress-spinner off

      # Fails loudly (instead of letting REQUIRE_* turn every sandbox test red)
      # when the runner cannot give the engine its Linux sandbox: the exact
      # unshare argv the engine uses, then the Landlock ABI probe.
      - name: Sandbox probe (unshare and Landlock)
        run: |
          echo "kernel $(uname -r)"
          userns=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -r "${userns}" ]; then
            echo "apparmor_restrict_unprivileged_userns=$(cat "${userns}")"
          fi
          if ! command -v unshare >/dev/null 2>&1; then
            echo "::error::unshare is not installed: the sandbox tests cannot run (REQUIRE_*=1)"
            exit 1
          fi
          uv run python - <<'PY'
          import subprocess
          import sys

          from autonomous_ai_agents.execution import launcher
          from autonomous_ai_agents.execution.sandbox import UNSHARE_ARGV

          HINT = (
              "decision 36: move this job to ubuntu-24.04 with "
              "'sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0'; "
              "never unset REQUIRE_*"
          )
          argv = [*UNSHARE_ARGV, "true"]
          probe = subprocess.run(argv, capture_output=True, timeout=30, check=False)
          if probe.returncode != 0:
              detail = probe.stderr.decode(errors="replace").strip()
              print(f"::error::{' '.join(argv)} exited {probe.returncode}: {detail} ({HINT})")
              sys.exit(1)
          print(f"{' '.join(argv)}: ok")
          try:
              abi = launcher.default_ops().syscall(444, (None, 0, 1))
          except OSError as error:
              print(f"::error::Landlock is unavailable: {error} ({HINT})")
              sys.exit(1)
          print(f"Landlock ABI {abi}")
          PY

      - name: Run tests with parallelization
        run: uv run pytest -m "not live" -n auto --cov --cov-report=xml --cov-report=term
        if: hashFiles('services/python_agents/tests/**/*.py') != ''

  # The macOS sandbox (sandbox-exec), Apple git and maxrss units, before the
  # M4 Pro dogfood (spec decision 6). Blocking since the Step 2 close-out.
  python-macos:
    name: Python execution tests (macOS)
    runs-on: macos-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.python == 'true' ||
      needs.detect-changes.outputs.workflows == 'true' ||
      github.event_name == 'push'
    permissions:
      contents: read
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./services/python_agents
    env:
      UV_PYTHON: '3.11'
      GIT_EXECUTABLE: /usr/bin/git
      REQUIRE_NETWORK_SANDBOX: '1'
      REQUIRE_FS_SANDBOX: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Setup uv (fast Python package installer)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Pinned: without it the action downloads whatever uv is latest.
          version: '0.11.32'
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Install dependencies with uv sync
        run: uv sync --frozen --extra dev

      # Same as the python job: the retry template and profiler shim tests
      # run every python3.N on PATH and fail in CI when one is missing.
      - name: Install workload interpreters 3.8 to 3.14
        run: |
          uv python install 3.8 3.9 3.10 3.11 3.12 3.13 3.14
          uv python dir --bin >> "$GITHUB_PATH"

      - name: Workload interpreters are on PATH
        run: |
          status=0
          for version in 3.8 3.9 3.10 3.11 3.12 3.13 3.14; do
            if command -v "python${version}" >/dev/null 2>&1; then
              echo "python${version}: $(command -v "python${version}") ($("python${version}" -c 'import sys; print(sys.version.split()[0])'))"
            else
              echo "::error::python${version} is not on PATH, so the profiler shim and retry template tests for it would skip"
              status=1
            fi
          done
          exit "${status}"

      - name: Sandbox probe (sandbox-exec and Apple git)
        run: |
          sw_vers
          "${GIT_EXECUTABLE}" --version
          if ! /usr/bin/sandbox-exec -p '(version 1) (allow default)' /usr/bin/true; then
            echo "::error::sandbox-exec cannot run a profile: the sandbox tests cannot run (REQUIRE_*=1)"
            exit 1
          fi
          echo "sandbox-exec: ok"

      - name: Run execution tests
        run: uv run pytest tests/execution --no-cov -m "not live" -n auto

  # Live Claude smoke test: costs money, so it runs only when started by hand
  # (Actions > CI > Run workflow), never on push or pull_request. The key is
  # passed to the test step only and never echoed (GitHub masks it as well).
  # Environment 'live' holds ANTHROPIC_API_KEY as an environment secret (not a
  # repository secret). The owner removed its required reviewers on 2026-10-24
  # (STATUS.md), so each run's hard cost cap is what bounds the spend.
  live-smoke:
    name: Live Claude API suite (manual)
    runs-on: ubuntu-22.04
    if: github.event_name == 'workflow_dispatch'
    environment: live
    permissions:
      contents: read
    # Each whole loop takes a few minutes of real trials (up to about 8): Stage A
    # runs 2, attack 3, corpus 15, hard 10 and oss at most 10 (larger
    # repositories). A killed job loses the cost table, so each suite gets room
    # for its loops (the hosted maximum is 360). Under the Step 3 noise rule
    # (paired trials, confirmation, calibration) and wired ideas, L1a and L1b
    # measured hard 28-29 and corpus 34 minutes (2.3-2.9 a loop, 2026-10-25),
    # so both sit at the 8-minutes-a-loop floor: hard 90, corpus 120. oss
    # keeps 300 (D41's 2.6x estimate) until L2a measures it.
    timeout-minutes: ${{ inputs.suite == 'sweep' && 240 || inputs.suite == 'sweep-fable' && 180 || inputs.suite == 'sweep-record' && 150 || inputs.suite == 'ab' && 360 || inputs.suite == 'noise' && 90 || inputs.suite == 'oss-ab' && 120 || inputs.suite == 'evolve' && 300 || inputs.suite == 'evolve-more' && 300 || inputs.suite == 'build' && 120 || inputs.suite == 'upstream-verify' && 150 || inputs.suite == 'upstream' && 300 || inputs.suite == 'heal-agent' && 120 || inputs.suite == 'research-agent' && 45 || inputs.suite == 'watch' && 90 || inputs.suite == 'escalation' && 90 || inputs.suite == 'triage' && 90 || inputs.suite == 'papers' && 60 || inputs.suite == 'web' && 90 || inputs.suite == 'corpus' && 120 || inputs.suite == 'oss' && 300 || inputs.suite == 'hard' && 90 || inputs.suite == 'attack' && 45 || 30 }}
    defaults:
      run:
        working-directory: ./services/python_agents
    env:
      # CPython 3.11 as the python job, except the upstream corpus suites: the
      # networkx before-trees need 3.12, which every candidate admits
      # (upstream.UPSTREAM_PYTHON; prepare_repo refuses one outside its range).
      UV_PYTHON: ${{ (inputs.suite == 'upstream' || inputs.suite == 'upstream-verify') && '3.12' || '3.11' }}
      # The live E2E and attack runs must be sandboxed: a runner that cannot
      # isolate fails instead of running Claude-edited code unconfined.
      REQUIRE_NETWORK_SANDBOX: '1'
      REQUIRE_FS_SANDBOX: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.UV_PYTHON }}

      - name: Setup uv (fast Python package installer)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Pinned: without it the action downloads whatever uv is latest.
          version: '0.11.32'
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Install dependencies with uv sync
        run: uv sync --frozen --extra dev --extra database --extra experiments

      # The same probe as the python job: fail loudly before any money is
      # spent when the runner cannot give the engine its Linux sandbox.
      - name: Sandbox probe (unshare and Landlock)
        run: |
          echo "kernel $(uname -r)"
          userns=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -r "${userns}" ]; then
            echo "apparmor_restrict_unprivileged_userns=$(cat "${userns}")"
          fi
          if ! command -v unshare >/dev/null 2>&1; then
            echo "::error::unshare is not installed: the live E2E cannot be sandboxed (REQUIRE_*=1)"
            exit 1
          fi
          uv run python - <<'PY'
          import subprocess
          import sys

          from autonomous_ai_agents.execution import launcher
          from autonomous_ai_agents.execution.sandbox import UNSHARE_ARGV

          HINT = (
              "decision 36: move this job to ubuntu-24.04 with "
              "'sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0'; "
              "never unset REQUIRE_*"
          )
          argv = [*UNSHARE_ARGV, "true"]
          probe = subprocess.run(argv, capture_output=True, timeout=30, check=False)
          if probe.returncode != 0:
              detail = probe.stderr.decode(errors="replace").strip()
              print(f"::error::{' '.join(argv)} exited {probe.returncode}: {detail} ({HINT})")
              sys.exit(1)
          print(f"{' '.join(argv)}: ok")
          try:
              abi = launcher.default_ops().syscall(444, (None, 0, 1))
          except OSError as error:
              print(f"::error::Landlock is unavailable: {error} ({HINT})")
              sys.exit(1)
          print(f"Landlock ABI {abi}")
          PY

      # -m live replaces the default "not live" filter; --no-cov because the
      # live tests alone cannot meet the suite's coverage gate; -n 0 so one
      # session ledger sees every test. The key reaches only this step and is
      # never printed; a missing key fails here instead of letting every live
      # test skip. The inputs arrive through env only and are validated before
      # anything runs: the suite picks the paths, the model sets ENGINE_MODEL
      # (Sonnet with ENGINE_FALLBACKS off, so the comparison bills Sonnet only
      # and its worst case is priced on Sonnet alone), and the cap becomes
      # LIVE_SUITE_CAP_USD, which tests/live/conftest.py enforces before each
      # test spends. The mode becomes LIVE_CORPUS_MODE (the corpus, hard and
      # oss suites read it; stage-a and attack ignore it). editor_model sets
      # EDITOR_MODEL with EDITOR_EFFORT=low, which start_loop and
      # start_oss_loop give its own captured editor transport. Every suite gets
      # its noise rule explicitly. The cost table and
      # the corpus summary go to the job summary; one JSON line per corpus run
      # goes to LIVE_RESULTS_PATH.
      - name: Run live tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INPUT_SUITE: ${{ inputs.suite }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_ENGINE_MODEL: ${{ inputs.engine_model }}
          INPUT_EDITOR_MODEL: ${{ inputs.editor_model }}
          INPUT_SUITE_CAP_USD: ${{ inputs.suite_cap_usd }}
          INPUT_OSS_REPO: ${{ inputs.oss_repo }}
          INPUT_UPSTREAM_BATCH: ${{ inputs.upstream_batch }}
          LIVE_RESULTS_PATH: ${{ runner.temp }}/live-results.jsonl
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::the ANTHROPIC_API_KEY secret of environment 'live' is not set"
            exit 1
          fi
          corpus=(--ignore=tests/live/test_corpus_live.py --ignore=tests/live/test_attack_corpus_live.py --ignore=tests/live/test_hard_corpus_live.py --ignore=tests/live/test_oss_live.py --ignore=tests/live/experiments --ignore=tests/live/test_sweep_live.py --ignore=tests/live/test_ab_live.py --ignore=tests/live/test_escalation_live.py --ignore=tests/live/test_noise_live.py --ignore=tests/live/test_oss_ab_live.py --ignore=tests/live/test_evolution_live.py --ignore=tests/live/test_build_live.py --ignore=tests/live/test_grader_agreement_live.py --ignore=tests/live/test_upstream_verify_live.py --ignore=tests/live/test_upstream_live.py)
          # need: the sum of the caps the suite's live tests ask the ledger for
          # (Stage A 8.55, corpus 15 x 5, attack 3 x 4, hard 10 x 5, oss at most
          # 10 x 5; the Window 0 experiments under tests/live/experiments: probes
          # 0.46, triage 1.25, papers 3 x 1.25 + 2 x 2.75 + 0.75, web 18 caps 51.08, prescreen 2 x 1.11; the discovery
          # suites, the sweeps on 37 repositories (v1, hard and v2: 32 slowdowns,
          # 5 controls): sweep 111.75, sweep-fable 40.3 (one Sonnet arm and
          # Fable 5.1 on the 12 v1 slowdowns), sweep-record 23.5 (one Sonnet
          # arm, recorded), ab 2
          # reps 140, escalation 42.9; acquire 0.60 (Part B; Part A is free);
          # noise 0 (no request); heal 8 x 0.75; oss-ab one library 102.6 (2
          # reps x (1.30 generation + 2 arms x 10 trials x 2.50)); evolve 3
          # repos x 10 rounds x (0.45 + 3); evolve-more the same on 4 more
          # libraries, 138; heal-hard 10 x 0.75; build 3 specs x (0.80 build +
          # 0.60 generation + 7.50 loop)); grader 6 repositories x 0.22725
          # (L3, one grader request each); upstream-verify 0 (no request);
          # upstream a batch of 10 verified candidates x 5 (one wired loop each);
          # agent-probes 0.97 (A0: five probes at 0, 0, 0.47, 0.30 and 0.20);
          # heal-agent 12 new bugs x 0.40 + 16 regression bugs x 0.20 (P1,
          # A1: one run per bug, both arms);
          # research-agent 7.35 (A2: arm A 5 x 1.14, arm B 5 x 0.30, the
          # builder's injection page 0.15; each A2s page adds 0.15);
          # watch 1.85 (A3: one hosted run's worst case, the 25-cent session
          # budget + one maximal Haiku 5.5 request + 22 watched minutes, 1.60,
          # and a listing's triage, 0.25); watch-cleanup 1.60 (one session no
          # ledger saw),
          # rounded up; a smaller cap would refuse, and fail, the later
          # tests of the suite.
          case "${INPUT_SUITE}" in
            stage-a) paths=(tests/live tests/execution/test_editor.py "${corpus[@]}"); need=9 ;;
            corpus) paths=(tests/live/test_corpus_live.py); need=75 ;;
            attack) paths=(tests/live/test_attack_corpus_live.py); need=12 ;;
            hard) paths=(tests/live/test_hard_corpus_live.py); need=50 ;;
            oss) paths=(tests/live/test_oss_live.py); need=50 ;;
            probes) paths=(tests/live/experiments/test_probes_live.py); need=1 ;;
            triage) paths=(tests/live/experiments/test_triage_live.py); need=2 ;;
            papers) paths=(tests/live/experiments/test_extraction_live.py); need=10 ;;
            web) paths=(tests/live/experiments/test_web_live.py); need=52 ;;
            prescreen) paths=(tests/live/experiments/test_prescreen_live.py); need=3 ;;
            sweep) paths=(tests/live/test_sweep_live.py); need=112 ;;
            sweep-fable) paths=(tests/live/test_sweep_live.py); need=41 ;;
            sweep-record) paths=(tests/live/test_sweep_live.py); need=24 ;;
            ab) paths=(tests/live/test_ab_live.py); need=140 ;;
            escalation) paths=(tests/live/test_escalation_live.py); need=43 ;;
            acquire) paths=(tests/live/experiments/test_acquire_live.py); need=1 ;;
            noise) paths=(tests/live/test_noise_live.py); need=0 ;;
            heal) paths=(tests/live/experiments/test_heal_live.py); need=6 ;;
            oss-ab) paths=(tests/live/test_oss_ab_live.py); need=103 ;;
            evolve) paths=(tests/live/test_evolution_live.py); need=104 ;;
            evolve-more) paths=(tests/live/test_evolution_live.py); need=138 ;;
            heal-hard) paths=(tests/live/experiments/test_heal_live.py); need=8 ;;
            build) paths=(tests/live/test_build_live.py); need=27 ;;
            grader) paths=(tests/live/test_grader_agreement_live.py); need=2 ;;
            upstream-verify) paths=(tests/live/test_upstream_verify_live.py); need=0 ;;
            upstream) paths=(tests/live/test_upstream_live.py); need=50 ;;
            agent-probes) paths=(tests/live/experiments/test_agent_probes_live.py); need=1 ;;
            heal-agent) paths=(tests/live/experiments/test_heal_agent_live.py); need=8 ;;
            research-agent) paths=(tests/live/experiments/test_research_agent_live.py); need=8 ;;
            watch) paths=(tests/live/experiments/test_watch_managed_live.py); need=2 ;;
            watch-cleanup) paths=(tests/live/experiments/test_watch_managed_live.py); need=2 ;;
            *)
              echo "::error::unknown suite input (stage-a, corpus, attack, hard, oss, probes, triage, papers, web, prescreen, sweep, sweep-fable, sweep-record, ab, escalation, acquire, noise, heal, oss-ab, evolve, evolve-more, heal-hard, build, grader, upstream-verify, upstream, agent-probes, heal-agent, research-agent, watch or watch-cleanup)"
              exit 1
              ;;
          esac
          if [ "${INPUT_SUITE}" = sweep-fable ]; then
            # Fable 5.1 (the research plan's optional arm) beside the one arm
            # whose per-repository run phase 1 shares
            export LIVE_SWEEP_ARMS=sonnet-5-5-medium LIVE_SWEEP_FABLE=1
          fi
          if [ "${INPUT_SUITE}" = sweep-record ]; then
            # one Sonnet arm, recording hypotheses, grader verdicts and the
            # redacted replies for hand labels and offline replay
            export LIVE_SWEEP_ARMS=sonnet-5-5-medium LIVE_SWEEP_RECORD=1
          fi
          if [ "${INPUT_SUITE}" = heal-hard ]; then
            # the harder bugs: wrong-place causes, misleading reports, controls
            export LIVE_HEAL_SET=hard
          fi
          if [ "${INPUT_SUITE}" = watch-cleanup ]; then
            # A3 (P3): no hosted run, only the cleanup and its listing check
            export LIVE_WATCH_CANCEL=1
          fi
          if [ "${INPUT_SUITE}" = evolve-more ]; then
            # the four other libraries the OSS A/B improved
            export LIVE_EVOLVE_REPOS=idna,mistune,sqlparse,pycparser
          fi
          if [ "${INPUT_SUITE}" = oss-ab ]; then
            # one library a dispatch: the whole plan needs more than the ceiling
            if ! [[ "${INPUT_OSS_REPO}" =~ ^[a-z][a-z0-9_]{0,39}$ ]]; then
              echo "::error::oss-ab needs oss_repo, one OSS library name (lower case)"
              exit 1
            fi
            export LIVE_OSS_AB_REPOS="${INPUT_OSS_REPO}"
          elif [ -n "${INPUT_OSS_REPO}" ]; then
            echo "::error::oss_repo is only for the oss-ab suite"
            exit 1
          fi
          if [ "${INPUT_SUITE}" = upstream ] || [ "${INPUT_SUITE}" = upstream-verify ]; then
            # ten candidates a dispatch; the packages some need beyond their
            # checkout: exact versions, wheels only, hash-pinned, no deps
            case "${INPUT_UPSTREAM_BATCH}" in
              1 | 2 | 3) export LIVE_UPSTREAM_BATCH="${INPUT_UPSTREAM_BATCH}" ;;
              *)
                echo "::error::upstream_batch must be 1, 2 or 3"
                exit 1
                ;;
            esac
            if [ "${INPUT_SUITE}" = upstream ] && [ "${INPUT_MODE}" != wired ]; then
              echo "::error::the upstream suite runs wired only (mode wired)"
              exit 1
            fi
            uv pip install --no-deps --require-hashes --only-binary :all: -r tests/fixtures/upstream_corpus/requirements.txt
          fi
          case "${INPUT_MODE}" in
            aimed) ;;
            blind) ;;
            decoy) ;;
            wired) ;;
            *)
              echo "::error::unknown mode input (aimed, blind, decoy or wired)"
              exit 1
              ;;
          esac
          case "${INPUT_ENGINE_MODEL}" in
            claude-opus-5-5) ;;
            claude-sonnet-5-5) export ENGINE_FALLBACKS=false ;;
            *)
              echo "::error::unknown engine_model input"
              exit 1
              ;;
          esac
          case "${INPUT_EDITOR_MODEL}" in
            default) ;;
            claude-sonnet-5-5) export EDITOR_MODEL=claude-sonnet-5-5 EDITOR_EFFORT=low ;;
            *)
              echo "::error::unknown editor_model input (default or claude-sonnet-5-5)"
              exit 1
              ;;
          esac
          # The noise rule of every suite, never a default (D41): step3 measures
          # the Step 3 defaults (paired trials, confirmation, 3 calibration
          # blocks) on L0-L2; step2 keeps Step 2's measurement for the other
          # suites (their timeouts and Window 0 comparisons; an A/A floor of a
          # millisecond workload can pass 100 % and stop the run).
          case "${INPUT_SUITE}" in
            noise | corpus | hard | oss | upstream-verify | upstream) noise_rule=step3 ;;
            stage-a | attack | probes | triage | papers | web | prescreen) noise_rule=step2 ;;
            sweep | sweep-fable | sweep-record | ab | escalation | acquire) noise_rule=step2 ;;
            heal | oss-ab | evolve | evolve-more | heal-hard | build | grader | agent-probes | heal-agent | research-agent) noise_rule=step2 ;;
            watch | watch-cleanup) noise_rule=step2 ;;
            *)
              echo "::error::no noise rule for suite ${INPUT_SUITE}"
              exit 1
              ;;
          esac
          if [ "${noise_rule}" = step3 ]; then
            export PAIRED_TRIALS=true CONFIRM_WINNERS=true NOISE_CALIBRATION_BLOCKS=3
          else
            export PAIRED_TRIALS=false CONFIRM_WINNERS=false NOISE_CALIBRATION_BLOCKS=0
          fi
          if [ "${INPUT_SUITE}" = noise ]; then
            # L0: A/A blocks through the engine's paired path, 10 a repository
            export LIVE_NOISE_PATH=paired
          fi
          if ! [[ "${INPUT_SUITE_CAP_USD}" =~ ^[0-9]{1,3}([.][0-9]{1,2})?$ ]] ||
            ! awk -v cap="${INPUT_SUITE_CAP_USD}" 'BEGIN { exit !(cap > 0 && cap <= 150) }'; then
            echo "::error::suite_cap_usd must be a number of USD above 0 and at most 150"
            exit 1
          fi
          if ! awk -v cap="${INPUT_SUITE_CAP_USD}" -v need="${need}" 'BEGIN { exit !(cap >= need) }'; then
            echo "::error::suite_cap_usd ${INPUT_SUITE_CAP_USD} is below the ${need} USD suite ${INPUT_SUITE} needs to admit every test"
            exit 1
          fi
          export ENGINE_MODEL="${INPUT_ENGINE_MODEL}"
          export LIVE_SUITE_CAP_USD="${INPUT_SUITE_CAP_USD}"
          export LIVE_CORPUS_MODE="${INPUT_MODE}"
          : > "${LIVE_RESULTS_PATH}"
          echo "suite ${INPUT_SUITE}, mode ${LIVE_CORPUS_MODE}, ENGINE_MODEL ${ENGINE_MODEL}, EDITOR_MODEL ${EDITOR_MODEL:-default}, noise rule ${noise_rule}, LIVE_SUITE_CAP_USD ${LIVE_SUITE_CAP_USD}"
          uv run pytest "${paths[@]}" -m live --no-cov -n 0 -rA

      # One JSON line per corpus run (CorpusOutcome), kept for the STATUS
      # ledger and the stage M comparison across runs.
      - name: Upload live corpus results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-results.jsonl
          if-no-files-found: ignore
          retention-days: 30

  # Database schema: apply every migration to a real Postgres, then re-apply the
  # engine migrations (003 onward) to prove they are idempotent. 001 and 002 are
  # not idempotent (plain CREATE TABLE packages, CREATE INDEX idx_packages_name),
  # so they run once. Same pinned image as the python job's service.
  schema-apply:
    name: Schema Apply (Postgres)
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.infrastructure == 'true' ||
      needs.detect-changes.outputs.workflows == 'true' ||
      github.event_name == 'push'
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_DB: ai_platform
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: devpass
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U dev -d ai_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure psql is available
        run: which psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      # Same order as docker-entrypoint-initdb.d on a fresh volume (file name
      # order); every file runs exactly once here.
      - name: Apply migrations once in order (001 onward)
        run: |
          for file in infrastructure/schema/*.sql; do
            echo "::group::${file}"
            PGPASSWORD=devpass psql -h localhost -U dev -d ai_platform -v ON_ERROR_STOP=1 -f "${file}"
            echo "::endgroup::"
          done

      - name: Re-apply 003 onward and diff the catalog (idempotence proof)
        run: |
          snapshot() {
            {
              PGPASSWORD=devpass psql -h localhost -U dev -d ai_platform -v ON_ERROR_STOP=1 -tAc "SELECT conrelid::regclass, conname, pg_get_constraintdef(oid) FROM pg_constraint WHERE connamespace = 'public'::regnamespace ORDER BY 1, 2"
              PGPASSWORD=devpass psql -h localhost -U dev -d ai_platform -v ON_ERROR_STOP=1 -tAc "SELECT tablename, indexname, indexdef FROM pg_indexes WHERE schemaname = 'public' ORDER BY 1, 2"
              PGPASSWORD=devpass psql -h localhost -U dev -d ai_platform -v ON_ERROR_STOP=1 -tAc "SELECT table_name, column_name, data_type, is_nullable, column_default, is_identity FROM information_schema.columns WHERE table_schema = 'public' ORDER BY 1, 2"
            } > "$1"
          }
          snapshot "${RUNNER_TEMP}/schema-before.txt"
          # Every engine migration from 003 on, in file-name order, so a new
          # migration is covered without a workflow edit (Step 3, D25).
          for file in infrastructure/schema/*.sql; do
            case "$(basename "${file}")" in
              00[12]_*) continue ;;
            esac
            echo "::group::re-apply ${file}"
            PGPASSWORD=devpass psql -h localhost -U dev -d ai_platform -v ON_ERROR_STOP=1 -f "${file}"
            echo "::endgroup::"
          done
          snapshot "${RUNNER_TEMP}/schema-after.txt"
          echo "catalog: $(wc -l < "${RUNNER_TEMP}/schema-before.txt") lines"
          diff -u "${RUNNER_TEMP}/schema-before.txt" "${RUNNER_TEMP}/schema-after.txt"

      - name: Verify engine tables and columns
        run: |
          query() {
            PGPASSWORD=devpass psql -h localhost -U dev -d ai_platform -v ON_ERROR_STOP=1 -tAc "$1"
          }
          status=0
          for table in projects workloads objectives guardrails techniques hotspots hypotheses lessons; do
            if [ "$(query "SELECT to_regclass('public.${table}') IS NOT NULL")" = "t" ]; then
              echo "table ${table}: present"
            else
              echo "::error::table ${table} is missing"
              status=1
            fi
          done
          # table.column:data_type (003 research columns, the 004 additions,
          # then 005's caller-id columns)
          for spec in research_papers.claims:jsonb research_papers.citation_count:integer \
            projects.test_command:jsonb lessons.seq:bigint \
            lessons.gain:'double precision' lessons.weight:'double precision' \
            lessons.hypothesis_id:'character varying' lessons.technique_id:'character varying'; do
            target="${spec%%:*}"
            want="${spec#*:}"
            got="$(query "SELECT data_type FROM information_schema.columns WHERE table_schema = 'public' AND table_name = '${target%%.*}' AND column_name = '${target#*.}'")"
            if [ "${got}" = "${want}" ]; then
              echo "column ${target} (${want}): present"
            else
              echo "::error::column ${target} should be ${want}, found '${got}'"
              status=1
            fi
          done
          for index in uq_task_thread uq_lessons_seq; do
            if [ "$(query "SELECT to_regclass('public.${index}') IS NOT NULL")" = "t" ]; then
              echo "index ${index}: present"
            else
              echo "::error::index ${index} is missing"
              status=1
            fi
          done
          if [ "$(query "SELECT count(*) FROM pg_constraint WHERE conname = 'chk_project_test_command_argv' AND conrelid = 'public.projects'::regclass")" = "1" ]; then
            echo "constraint chk_project_test_command_argv: present once"
          else
            echo "::error::constraint chk_project_test_command_argv is missing or duplicated"
            status=1
          fi
          # 005: the caller-id columns are 64 wide, each with its id-rule CHECK
          for column in hypothesis_id technique_id; do
            width="$(query "SELECT character_maximum_length FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'lessons' AND column_name = '${column}'")"
            if [ "${width}" = "64" ]; then
              echo "column lessons.${column}: VARCHAR(64)"
            else
              echo "::error::column lessons.${column} should be VARCHAR(64), found width '${width}'"
              status=1
            fi
            if [ "$(query "SELECT count(*) FROM pg_constraint WHERE conname = 'chk_lesson_${column}' AND conrelid = 'public.lessons'::regclass")" = "1" ]; then
              echo "constraint chk_lesson_${column}: present once"
            else
              echo "::error::constraint chk_lesson_${column} is missing or duplicated"
              status=1
            fi
          done
          # 006: a lesson may record the review outcome (D35)
          if [ "$(query "SELECT count(*) FROM pg_constraint WHERE conname = 'chk_lesson_outcome' AND conrelid = 'public.lessons'::regclass AND pg_get_constraintdef(oid) LIKE '%''review''%'")" = "1" ]; then
            echo "constraint chk_lesson_outcome: allows review"
          else
            echo "::error::constraint chk_lesson_outcome does not allow review (006)"
            status=1
          fi
          exit "${status}"

  # Database init exactly as a developer runs it: docker compose starts the
  # postgres service on an empty volume, the image's entrypoint applies every
  # file mounted at /docker-entrypoint-initdb.d, and the result must be a
  # healthy database with the 14 engine tables and no error in the init log.
  compose-init:
    name: Compose Init (Postgres)
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.infrastructure == 'true' ||
      needs.detect-changes.outputs.workflows == 'true' ||
      github.event_name == 'push'
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      COMPOSE_FILE: docker-compose.dev.yml

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start postgres on an empty volume
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up -d postgres

      - name: Wait for the healthcheck
        run: |
          container="$(docker compose ps -q postgres)"
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "${container}")"
            if [ "${status}" = "healthy" ]; then
              echo "postgres is healthy"
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Status}}' "${container}")" != "running" ]; then
              echo "::error::postgres container stopped during init"
              docker compose logs postgres
              exit 1
            fi
            sleep 2
          done
          echo "::error::postgres did not become healthy in 120 s"
          docker compose logs postgres
          exit 1

      # A client connecting while the server boots or restarts after the init
      # scripts (the health check, a racing probe) logs "FATAL: the database
      # system is starting up" (or "shutting down"); that is a refused
      # connection, not an init error, so only those exact lines are dropped.
      - name: Init log has no errors
        run: |
          docker compose logs postgres > /tmp/postgres-init.log
          if grep -vE 'FATAL:  the database system is (starting up|shutting down)$' /tmp/postgres-init.log |
            grep -iE '(^|[^a-z])(error|fatal)([^a-z]|$)'; then
            echo "::error::postgres init log contains errors (see above)"
            exit 1
          fi
          echo "init log is clean ($(wc -l < /tmp/postgres-init.log) lines)"

      - name: Database has the 14 engine tables
        run: |
          count="$(docker compose exec -T postgres psql -U dev -d ai_platform -tAc \
            "select count(*) from pg_tables where schemaname = 'public'")"
          echo "public tables: ${count}"
          docker compose exec -T postgres psql -U dev -d ai_platform -c '\dt'
          if [ "${count}" != "14" ]; then
            echo "::error::expected 14 tables after 001 -> 006 (004 to 006 add none), found ${count}"
            exit 1
          fi

      - name: Tear down (volume included)
        if: always()
        run: docker compose down -v --remove-orphans

  # Dependency security scan (optimized)
  security:
    name: Security Scan
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.typescript == 'true' ||
      needs.detect-changes.outputs.workflows == 'true' ||
      github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.20.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Blocking: the stage gate already requires a clean audit at moderate+,
      # and a non-blocking audit never stopped a vulnerable lockfile.
      - name: Run pnpm audit
        run: pnpm audit --audit-level=high

  # Docker security scan (optimized with Trivy caching)
  docker-security:
    name: Docker Security Scan
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch'
    # No security-events: results go to an artifact, not SARIF upload.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cache Trivy database for 40-50% speedup
      - name: Cache Trivy Database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      # Consolidated single scan (70% faster than 3 separate scans)
      - name: Run Trivy - All Severities
        # Commit of the signed v0.36.0 tag (on master; its nested actions are
        # SHA-pinned). A mutable branch ref would run unreviewed code here.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          exit-code: '0'

      # Process results and generate reports
      - name: Process Trivy Results
        if: always()
        run: |
          # Extract HIGH/CRITICAL issues
          if [ -f trivy-results.json ]; then
            jq '.Results[] | select(.Misconfigurations != null) | .Misconfigurations[] | select(.Severity == "CRITICAL" or .Severity == "HIGH")' trivy-results.json > high-critical.json || echo "[]" > high-critical.json

            # Extract MEDIUM/LOW issues
            jq '.Results[] | select(.Misconfigurations != null) | .Misconfigurations[] | select(.Severity == "MEDIUM" or .Severity == "LOW")' trivy-results.json > medium-low.json || echo "[]" > medium-low.json

            # Count issues
            HIGH_CRITICAL_COUNT=$(jq -s 'length' high-critical.json)
            MEDIUM_LOW_COUNT=$(jq -s 'length' medium-low.json)

            {
              echo "HIGH_CRITICAL_COUNT=$HIGH_CRITICAL_COUNT"
              echo "MEDIUM_LOW_COUNT=$MEDIUM_LOW_COUNT"
            } >> "$GITHUB_ENV"
          fi

      # Upload optimized artifacts
      - name: Upload Trivy Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-security-scan-${{ github.run_number }}
          path: |
            trivy-results.json
            high-critical.json
            medium-low.json
          retention-days: 14
          compression-level: 6

      # Enhanced security summary. github.* values reach the script through
      # env, never through ${{ }} inside run: (no script injection).
      - name: Generate Security Summary
        if: always()
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "# 🔒 Trivy Security Scan Report"
            echo ""

            # Status badge
            if [ "${HIGH_CRITICAL_COUNT:-0}" -gt 0 ]; then
              echo "![Status](https://img.shields.io/badge/Security-FAILED-red?style=for-the-badge&logo=security)"
            elif [ "${MEDIUM_LOW_COUNT:-0}" -gt 0 ]; then
              echo "![Status](https://img.shields.io/badge/Security-WARNING-yellow?style=for-the-badge&logo=security)"
            else
              echo "![Status](https://img.shields.io/badge/Security-PASSED-brightgreen?style=for-the-badge&logo=security)"
            fi

            echo ""
            echo "| Severity | Count |"
            echo "|----------|-------|"
            echo "| 🔴 CRITICAL/HIGH | ${HIGH_CRITICAL_COUNT:-0} |"
            echo "| 🟡 MEDIUM/LOW | ${MEDIUM_LOW_COUNT:-0} |"
            echo ""
            echo "📅 **Scan Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "📦 **Repository:** \`${REPOSITORY}\`"
            echo "🌿 **Branch:** \`${REF_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # FAIL if CRITICAL/HIGH found
      - name: Check for HIGH/CRITICAL Vulnerabilities
        if: always()
        run: |
          if [ "${HIGH_CRITICAL_COUNT:-0}" -gt 0 ]; then
            echo "❌ Found ${HIGH_CRITICAL_COUNT} CRITICAL/HIGH severity issues!"
            echo "Please review the security scan results above."
            exit 1
          else
            echo "✅ No CRITICAL/HIGH severity vulnerabilities found."
          fi
