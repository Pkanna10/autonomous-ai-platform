# Dependabot configuration for automated dependency updates
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # npm dependencies (pnpm monorepo)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
      timezone: 'America/Los_Angeles'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'automated'
    commit-message:
      prefix: 'chore(deps)'
    # Group minor and patch updates together
    groups:
      typescript-deps:
        patterns:
          - 'typescript'
          - '@types/*'
      eslint-deps:
        patterns:
          - 'eslint*'
          - '@typescript-eslint/*'
      vitest-deps:
        patterns:
          - 'vitest'
          - '@vitest/*'
      prettier-deps:
        patterns:
          - 'prettier'
          - 'eslint-*-prettier'
      commitlint-deps:
        patterns:
          - '@commitlint/*'

  # Docker images from docker-compose
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
      timezone: 'America/Los_Angeles'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'docker'
      - 'automated'
    commit-message:
      prefix: 'chore(docker)'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
      timezone: 'America/Los_Angeles'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'ci'
      - 'automated'
    commit-message:
      prefix: 'chore(ci)'
